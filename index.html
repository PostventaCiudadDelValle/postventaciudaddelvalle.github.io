    if(d){if(varios&&isAdmin())h+=eq.filter(m=>m.estado!=="cancelada").map(m=>`<button class="btn btn-lime" data-act="reporte" data-id="${m.id}">${esc(repLbl(m))}</button>`).join("");
      else h+=`<button class="btn btn-lime" data-act="reporte" data-id="${t.id}">${repLbl(t)}</button>`}
    if(isAdmin()&&abierta)h+=`<div class="row wrapr">${d?`<button class="btn btn-ghost btn-sm" data-act="posponer" data-id="${t.id}">Posponer</button><button class="btn btn-ghost btn-sm" data-act="hora" data-id="${t.id}">Cambiar hora</button>`:""}<button class="btn btn-ghost btn-sm" data-act="duracion" data-id="${t.id}">Modificar duración</button><button class="btn btn-ghost btn-sm" data-act="cambtrab" data-id="${t.id}">Cambiar trabajador</button><button class="btn btn-danger btn-sm" data-act="cancelar" data-id="${t.id}">Cancelar</button></div>`;

    else if(isAdmin()&&t.estado==="programada"&&d)h+=`<div class="stack" style="gap:4px">${recBtn(t).replace("btn-sm","")}${t.recordatorioEn?`<span class="muted small" style="text-align:center">Último recordatorio: ${fCorta(new Date(t.recordatorioEn))} ${hhmm(new Date(t.recordatorioEn))}</span>`:""}</div>`;
    if(isAdmin())h+=`<button class="btn btn-dark" data-act="mensaje" data-id="${t.id}">${I.link} Enlace y mensaje para el propietario</button>`;
    if(isAdmin()&&abierta)h+=`<button class="btn btn-ghost" data-act="reprog" data-id="${t.id}">Avisar reprogramación al propietario</button>`;
    if(isAdmin()&&t.estado==="pendiente")h+=`<button class="btn btn-ghost" data-act="seguimiento" data-id="${t.id}">Programar visita de seguimiento</button>`;
    if(isAdmin()&&t.estado==="cancelada")h+=`<button class="btn btn-ghost" data-act="reactivar" data-id="${t.id}">Reprogramar esta tarea</button>`;

function sheetPosponer(s){
  const t=S.tareas.find(x=>x.id===s.id);if(!t)return head("Posponer");
  const d=parse(t.inicio);
  const nextWork=x=>{let y=addDays(x,1);while(y.getDay()===0||y.getDay()===6)y=addDays(y,1);return y};
  const opts=[["1 hora más tarde",toStr(addMin(d,60))],["2 horas más tarde",toStr(addMin(d,120))],["Siguiente día hábil, misma hora",toStr(nextWork(d))],["Próxima semana, mismo día",toStr(addDays(d,7))]];
  const al=alcanceDe(t,s),obra=al==="obra";
  const nx=proximoMov(t,addMin(d,30),al);if(nx)opts.unshift([obra?"Próximo espacio libre para toda la obra":enEquipo(t)?"Próximo espacio libre para el equipo":"Próximo espacio libre",nx]);
  return head("Posponer",esc(casaTxt(casa(t.casaId)))+" · ahora "+fCorta(d)+" "+hhmm(d)+(enSerie(t)?" · "+diaTxt(t):"")+(enEquipo(t)?" · equipo: "+esc(equipoTxt(t)):""))+`<div class="stack">${alcanceHtml(t,s)}${opts.map(([lab,s2])=>{const ch=chequeoMov(movimientos(t,s2,al)),cf=ch.cf,fj=ch.fuera;const bad=cf.length||fj;const od=parse(s2);return `<div class="opt"><span style="min-width:0"><b>${lab}</b><br><span class="muted small">${obra?"desde el ":""}${fCorta(od)} · ${hhmm(od)}${cf.length?` · <span style="color:var(--danger)">choca con ${obra?conflictMsgF(cf):conflictMsg(cf)}</span>`:fj?` · <span style="color:var(--danger)">fuera del horario</span>`:""}</span></span><button class="btn ${bad?"btn-ghost":"btn-dark"} btn-sm" data-act="aplicarhora" data-id="${t.id}" data-s="${s2}" data-al="${al}" ${bad?"disabled":""}>Mover</button></div>`}).join("")}
  <button class="link" data-act="hora" data-id="${t.id}">Elegir otra fecha y hora ${I.next}</button></div>`;
}
// obras de varios días: ¿se mueve solo este día o este día y los siguientes?
function hayDiasSiguientes(t){return enSerie(t)&&!!t.inicio&&serieDe(t).some(x=>x.inicio&&x.inicio.slice(0,10)>t.inicio.slice(0,10)&&(x.estado==="programada"||x.estado==="por_confirmar"))}
function alcanceDe(t,s){return hayDiasSiguientes(t)&&s.alcance==="obra"?"obra":"dia"}
function alcanceHtml(t,s,verbo){
  if(!hayDiasSiguientes(t))return "";const al=alcanceDe(t,s);
  return `<div class="field"><span class="lbl">Esta tarea es el ${diaTxt(t).toLowerCase()} de una obra</span><div class="seg" role="group"><button type="button" data-act="alcance" data-m="dia" aria-pressed="${al==="dia"}">Solo este día</button><button type="button" data-act="alcance" data-m="obra" aria-pressed="${al==="obra"}">${verbo||"Mover"} este y los siguientes</button></div>
  ${al==="obra"?`<span class="muted small">${verbo?"Se cancelan este día y los que siguen.":"Los días siguientes se acomodan en días hábiles seguidos, a la misma hora."}</span>`:""}</div>`;
}
function sheetHora(s){

  <div class="two"><div class="field"><label for="h-fecha">${obra?"Nueva fecha de este día":"Fecha"}</label><input id="h-fecha" type="date" class="in" value="${s.hf||dkey(d)}"></div><div class="field"><label for="h-hora-btn">Hora</label>${clockField("h-hora",s.hh||pad(d.getHours())+":"+pad(d.getMinutes()))}</div></div>

  <div id="h-check"></div><button class="btn btn-lime" id="h-save" data-act="guardarhora" data-id="${t.id}">Guardar cambio y avisar</button></div>`;

function checkHora(){
  syncClock("h-hora");
  const t=S.tareas.find(x=>x.id===sheet?.id);const out=document.getElementById("h-check");if(!t||!out)return;
  const f=document.getElementById("h-fecha").value,h=document.getElementById("h-hora").value,tw=document.getElementById("h-trab").value;

  else if(parse(s)<new Date()){ok=false;m=`<div class="alert bad">Esa hora ya pasó.</div>`}
  else if(cf.length){ok=false;const nx=proximoLibre(ws,parse(s),t.duracion,ex);m=`<div class="alert bad">Choca con ${conflictMsg(cf)}.${nx?` <button type="button" class="link" style="color:inherit;text-decoration:underline" data-act="usarlibreh" data-s="${nx}">Usar ${fCorta(parse(nx))}, ${hhmm(parse(nx))}</button>`:""}</div>`}
  else if(fueraJornada(s,t.duracion)){ok=false;const nx=proximoLibre(ws,parse(s),t.duracion,ex);m=`<div class="alert bad">Fuera del horario de trabajo: ${HORARIO_TXT}.${nx?` <button type="button" class="link" style="color:inherit;text-decoration:underline" data-act="usarlibreh" data-s="${nx}">Usar ${fCorta(parse(nx))}, ${hhmm(parse(nx))}</button>`:""}</div>`}

async function aplicarHora(id,s,tw,alcance){
  const t=S.tareas.find(x=>x.id===id);if(!t)return;
  const obra=alcance==="obra"&&enSerie(t);if(obra)tw=null;
  tw=tw||t.trabajadorId;const cambioTrab=tw!==t.trabajadorId;const iniAntes=t.estado==="programada"?t.inicio:null;
  if(cambioTrab&&grupoDe(t).some(x=>x.id!==t.id&&x.trabajadorId===tw)){toast("Ese trabajador ya está en el equipo.");return}
  // un cambio de hora mueve a todo el equipo (y, si se pidió, los días siguientes de la obra); un cambio de trabajador solo afecta a esa persona
  const moves=movimientos(t,s,obra?"obra":"dia",tw),ch=chequeoMov(moves);
  if(ch.cf.length){toast("Ese horario ya está ocupado.");return}
  if(ch.fuera){toast("Ese horario está fuera de la jornada.");return}
  const mueve=s!==t.inicio;
  // orden de guardado para que la obra no choque consigo misma: primero las que se atrasan (de la última hacia atrás)
  const tarde=moves.filter(x=>x.s>(x.m.inicio||"")).sort((a,b)=>a.m.inicio<b.m.inicio?1:-1),resto=moves.filter(x=>!(x.s>(x.m.inicio||""))).sort((a,b)=>(a.m.inicio||"")<(b.m.inicio||"")?-1:1);
  const avisados=new Set(),dias=[...new Set(moves.map(x=>x.s))].sort();
  for(const mv of tarde.concat(resto)){
    const m=mv.m,ss=mv.s,esT=m.id===t.id,camb=esT&&cambioTrab,w=mv.w,antes=parse(m.inicio);
    if(!camb&&ss===m.inicio)continue;
    const upd={inicio:ss,historial:hist(m,!mueve&&camb?"Reasignada a "+(trab(w)?.nombre||""):`${antes?`Movida de ${fCorta(antes)} ${hhmm(antes)} a`:"Programada para"} ${fCorta(parse(ss))} ${hhmm(parse(ss))}${camb?" · reasignada a "+(trab(w)?.nombre||""):""}`)};
    if(camb)upd.trabajadorId=w;
    if(m.estado==="por_confirmar"){upd.estado="programada";upd.opciones=[]}
    if(m.recordatorioEn)upd.recordatorioEn=null;   // con la nueva hora o persona, el recordatorio se vuelve a pedir
    try{await patch("tareas",m.id,upd)}catch(e){return}
    // en una obra, un solo aviso por trabajador con el rango nuevo
    if(obra){if(!avisados.has(w)){avisados.add(w);await aviso(Object.assign({},m,upd),`Cambio de fechas: ${m.tipo} en ${casaTxt(casa(m.casaId))}, ahora del ${fCorta(parse(dias[0]))} al ${fCorta(parse(dias[dias.length-1]))}, ${hhmm(parse(s))}`)}continue}
    await aviso(Object.assign({},m,upd),`${camb?"Le asignaron":"Cambio de hora"}: ${m.tipo} en ${casaTxt(casa(m.casaId))}, ahora ${fCorta(parse(ss))} ${hhmm(parse(ss))}`);
    if(camb)await aviso(Object.assign({},m),`Se le quitó: ${m.tipo} en ${casaTxt(casa(m.casaId))}`);
  }
  toast(obra?"Obra reprogramada. Avise también al propietario.":moves.length>1?"Horario actualizado para todo el equipo. Avise también al propietario.":"Horario actualizado. Avise también al propietario.");
  // si una visita ya agendada cambió de fecha, se arma el aviso de reprogramación con motivo
  if(mueve&&iniAntes)openSheet({kind:"reprog",id,antes:iniAntes,motivo:"",obra});
  else openSheet({kind:"mensaje",id});
}

async function shrink(file){
  // reduce fotos grandes para ahorrar espacio
  try{
    const bmp=await createImageBitmap(file);const max=S.local?1000:1600;   // en modo local las fotos ocupan espacio del navegador
    const sc=Math.min(1,max/Math.max(bmp.width,bmp.height));
    const cv=document.createElement("canvas");cv.width=Math.round(bmp.width*sc);cv.height=Math.round(bmp.height*sc);cv.getContext("2d").drawImage(bmp,0,0,cv.width,cv.height);
    return await new Promise(r=>cv.toBlob(b=>r(b||file),"image/jpeg",S.local?.72:.82));
  }catch(e){return file}
}
async function guardarRep(id){

  if(est==="pendiente"&&!nota){toast("Describa qué quedó pendiente.");btn.disabled=false;return}
  const fotos=(t.fotos||[]).slice();
  for(const f of (sheet.files||[])){
    btn.textContent="Subiendo fotos… "+(fotos.length-(t.fotos||[]).length+1)+"/"+sheet.files.length;
    try{const blob=await shrink(f.file);const r=await assets.upload(blob);fotos.push(r.path?{path:r.path}:{id:r.id,url:r.url})}catch(e){toast("No se pudo subir una foto ("+(e&&e.code||"error")+").")}
  }
  try{await patch("tareas",id,{estado:est,nota,fotos,reportadoEn:new Date().toISOString(),historial:hist(t,(est==="finalizada"?"Marcada finalizada":"Quedó pendiente")+(sheet.files?.length?` · ${sheet.files.length} foto(s)`:""))})}catch(e){btn.disabled=false;btn.textContent="Guardar reporte";return}
  toast(est==="finalizada"?"Trabajo marcado como finalizado.":"Registrado como pendiente.");
  openSheet({kind:"detalle",id});
}

function blobUrl(f){
  if(f.path){if(SIGNED[f.path])return SIGNED[f.path];if(sb){signQ.add(f.path);clearTimeout(signT);signT=setTimeout(firmar,30)}return PIX}
  return f.id?"/_blob/"+f.id:f.url;
}

async function guardarReporte(){
  leerRepForm();const s=sheet;if(!s||s.kind!=="repform")return;const btn=document.getElementById("rp-save");
  const titulo=(s.titulo||"").trim(),texto=(s.texto||"").trim();
  if(!titulo){toast("Escriba un título.");document.getElementById("rp-tit").focus();return}
  if(!texto&&!s.fotos.length&&!s.files.length){toast("Agregue texto o imágenes.");return}
  if(s.files.length&&!assets){toast("Este acceso no permite subir imágenes.");return}
  btn.disabled=true;
  const fotos=s.fotos.slice();let fallo=0;
  for(let i=0;i<s.files.length;i++){btn.textContent=`Subiendo imágenes… ${i+1}/${s.files.length}`;
    try{const blob=await shrink(s.files[i].file);const r=await assets.upload(blob);fotos.push(r.path?{path:r.path}:{id:r.id,url:r.url})}catch(e){fallo++}}
  if(fallo)toast(fallo+(fallo===1?" imagen no se pudo subir.":" imágenes no se pudieron subir."));
  btn.textContent="Guardando…";
  const id=s.id||uid("r");const prev=S.reportes.find(x=>x.id===id);const trabajadorId=s.trab||null;
  const data={titulo,texto,casaId:s.casaId||null,trabajadorId,fotos,...(prev?{actualizado:new Date().toISOString()}:{creado:new Date().toISOString()})};
  try{if(prev)await patch("reportes",id,data);else await put("reportes",id,data)}catch(e){btn.disabled=false;btn.textContent=prev?"Guardar cambios":"Guardar reporte";return}
  if(trabajadorId&&(!prev||prev.trabajadorId!==trabajadorId)){try{await put("avisos",uid("a"),{trabajadorId,reporteId:id,tareaId:null,texto:"Nuevo reporte: "+titulo,creado:new Date().toISOString(),leido:false})}catch(e){}}
  s.files.forEach(f=>URL.revokeObjectURL(f.prev));
  toast(prev?"Reporte actualizado.":"Reporte guardado.");
  openSheet({kind:"repver",id});
}

// generador de PDF: se carga solo cuando se necesita
let JSPDF=null;
function cargarJsPDF(){
  if(window.jspdf)return Promise.resolve(window.jspdf.jsPDF);if(JSPDF)return JSPDF;
  JSPDF=new Promise((res,rej)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
    s.onload=()=>window.jspdf?res(window.jspdf.jsPDF):rej(new Error("red"));s.onerror=()=>{JSPDF=null;s.remove();rej(new Error("red"))};document.head.appendChild(s)});
  return JSPDF;
}
async function urlFoto(f){
  if(f.path){if(!SIGNED[f.path]&&sb){const {data}=await sb.storage.from("fotos").createSignedUrl(f.path,3600);if(data&&data.signedUrl)SIGNED[f.path]=data.signedUrl}return SIGNED[f.path]}
  return f.id?"/_blob/"+f.id:f.url;
}
async function imgParaPdf(f){
  const u=await urlFoto(f);if(!u)throw new Error("sin enlace");
  const bmp=await createImageBitmap(await (await fetch(u)).blob());
  const sc=Math.min(1,1400/Math.max(bmp.width,bmp.height));
  const cv=document.createElement("canvas");cv.width=Math.round(bmp.width*sc);cv.height=Math.round(bmp.height*sc);
  const g=cv.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,cv.width,cv.height);g.drawImage(bmp,0,0,cv.width,cv.height);
  return {data:cv.toDataURL("image/jpeg",.82),w:cv.width,h:cv.height};
}
// las fuentes estándar del PDF solo tienen caracteres latinos: se cambian comillas tipográficas, emojis, etc.
function pdfTxt(s){return String(s??"").replace(/[“”]/g,'"').replace(/[‘’]/g,"'").replace(/[–—]/g,"-").replace(/…/g,"...").replace(/[•●▪]/g,"-").replace(/\r/g,"").replace(/[^\n\x20-\x7E\xA0-\xFF]/g,"")}
async function generarPdfReporte(id,btn){
  const r=S.reportes.find(x=>x.id===id);if(!r)return;
  const txtBtn=btn?btn.textContent:"";if(btn){btn.disabled=true;btn.textContent="Preparando PDF…"}
  try{
    const jsPDF=await cargarJsPDF();
    const imgs=[];let fallo=0;const fs=r.fotos||[];
    for(let i=0;i<fs.length;i++){if(btn)btn.textContent=`Preparando imágenes… ${i+1}/${fs.length}`;try{imgs.push(await imgParaPdf(fs[i]))}catch(e){fallo++}}
    const doc=new jsPDF({unit:"mm",format:"letter"});
    const W=215.9,H=279.4,M=16,CW=W-2*M,BOT=H-18;
    const NEGRO=[17,17,17],LIMA=[181,211,15],GRIS=[110,110,104],LINEA=[226,226,220],TXT=[40,40,38];
    const w=trab(r.trabajadorId),c=casa(r.casaId),fecha=new Date(r.actualizado||r.creado||Date.now());
    const titulo=pdfTxt(r.titulo),fTxt=fLarga(fecha)+" de "+fecha.getFullYear();
    let y=0;
    const subtitulo=(t)=>{doc.setFont("helvetica","bold");doc.setFontSize(12);doc.setTextColor(...NEGRO);doc.text(t,M,y);doc.setFillColor(...LIMA);doc.rect(M,y+2,14,1.2,"F");y+=9};
    const nuevaPag=()=>{doc.addPage();doc.setFillColor(...NEGRO);doc.rect(0,0,W,14,"F");doc.setFillColor(...LIMA);doc.rect(0,14,W,1.2,"F");
      doc.setFont("helvetica","bold");doc.setFontSize(9);doc.setTextColor(...LIMA);doc.text("POSTVENTA · CIUDAD DEL VALLE",M,9);
      doc.setFont("helvetica","normal");doc.setTextColor(255,255,255);doc.text(doc.splitTextToSize(titulo,CW-75)[0],W-M,9,{align:"right"});y=26};
    // encabezado
    doc.setFillColor(...NEGRO);doc.rect(0,0,W,38,"F");doc.setFillColor(...LIMA);doc.rect(0,38,W,1.6,"F");
    doc.setFont("helvetica","bold");doc.setFontSize(9);doc.setTextColor(...LIMA);doc.text("POSTVENTA · CIUDAD DEL VALLE",M,12);
    doc.setFont("helvetica","normal");doc.setTextColor(200,200,195);doc.text(pdfTxt(fTxt),W-M,12,{align:"right"});
    doc.setFont("helvetica","bold");doc.setFontSize(18);doc.setTextColor(255,255,255);
    const tl=doc.splitTextToSize(titulo,CW).slice(0,2);doc.text(tl,M,tl.length>1?23:27);
    // datos
    y=48;
    const meta=[["Dirigido a",w?w.nombre+(w.especialidad?" · "+w.especialidad:""):"Equipo de postventa"]].concat(c?[["Casa",casaTxt(c)]]:[]).concat([["Fecha",fTxt+", "+hhmm(fecha)],["Preparado por","Administración de postventa"]]);
    const mh=6+meta.length*7.5;
    doc.setFillColor(244,244,240);doc.roundedRect(M,y,CW,mh,3,3,"F");
    meta.forEach(([k,v],i)=>{const yy=y+9+i*7.5;doc.setFont("helvetica","normal");doc.setFontSize(8.5);doc.setTextColor(...GRIS);doc.text(pdfTxt(k).toUpperCase(),M+6,yy);
      doc.setFont("helvetica","bold");doc.setFontSize(10.5);doc.setTextColor(...NEGRO);doc.text(doc.splitTextToSize(pdfTxt(v),CW-52)[0],M+46,yy)});
    y+=mh+11;
    // texto
    if(r.texto&&r.texto.trim()){
      subtitulo("Detalle");
      const lh=5.6;doc.setFont("helvetica","normal");doc.setFontSize(11);
      for(const ln of doc.splitTextToSize(pdfTxt(r.texto.trim()),CW)){
        if(y+lh>BOT)nuevaPag();
        doc.setFont("helvetica","normal");doc.setFontSize(11);doc.setTextColor(...TXT);doc.text(ln,M,y);y+=lh}
      y+=7;
    }
    // imágenes, dos por fila
    if(imgs.length){
      const gap=6,colW=(CW-gap)/2,maxH=100;
      const filaDe=i=>imgs.slice(i,i+2).map(im=>{const sc=Math.min(colW/im.w,maxH/im.h);return Object.assign({},im,{dw:im.w*sc,dh:im.h*sc})});
      const altoFila=f=>Math.max(...f.map(x=>x.dh))+7;
      if(y+8+altoFila(filaDe(0))>BOT)nuevaPag();   // el título no se queda solo al final de la página
      subtitulo("Imágenes ("+imgs.length+")");y-=1;
      for(let i=0;i<imgs.length;i+=2){
        const fila=filaDe(i),rowH=altoFila(fila);
        if(y+rowH>BOT)nuevaPag();
        fila.forEach((f,j)=>{const x0=M+j*(colW+gap),x=x0+(colW-f.dw)/2;
          doc.addImage(f.data,"JPEG",x,y,f.dw,f.dh,undefined,"FAST");doc.setDrawColor(...LINEA);doc.setLineWidth(.3);doc.rect(x,y,f.dw,f.dh);
          doc.setFont("helvetica","normal");doc.setFontSize(8.5);doc.setTextColor(...GRIS);doc.text("Imagen "+(i+j+1),x0+colW/2,y+f.dh+4.5,{align:"center"})});
        y+=rowH+4;
      }
    }
    // pie de página
    const n=doc.getNumberOfPages();
    for(let p=1;p<=n;p++){doc.setPage(p);doc.setDrawColor(...LINEA);doc.setLineWidth(.3);doc.line(M,H-12,W-M,H-12);
      doc.setFont("helvetica","normal");doc.setFontSize(8);doc.setTextColor(...GRIS);doc.text("Adelante · Postventa Ciudad del Valle",M,H-7);doc.text("Página "+p+" de "+n,W-M,H-7,{align:"right"})}
    const nombre=("Reporte - "+titulo).replace(/[\\/:*?"<>|]+/g,"").replace(/\s+/g," ").trim().slice(0,70)+" - "+dkey(fecha)+".pdf";
    const file=new File([doc.output("blob")],nombre,{type:"application/pdf"});
    if(sheet&&sheet.pdf&&sheet.pdf.url)URL.revokeObjectURL(sheet.pdf.url);
    const pdf={rid:r.id,ver:repVer(r),file,url:URL.createObjectURL(file)};
    if(sheet&&sheet.kind==="repver"&&sheet.id===id){sheet.pdf=pdf;openSheet(Object.assign(sheet,{_keep:true}))}
    toast(fallo?(fallo===1?"PDF listo, pero 1 imagen no se pudo incluir.":"PDF listo, pero "+fallo+" imágenes no se pudieron incluir."):"PDF listo.");
  }catch(e){
    toast(e&&e.message==="red"?"No se pudo cargar el generador de PDF. Revise la conexión a internet.":"No se pudo generar el PDF.");
    if(btn&&btn.isConnected){btn.disabled=false;btn.textContent=txtBtn}
  }
}

  return `${saludo}\n\nLe confirmamos la visita de mantenimiento en ${casaTxt(c)}:\n• Trabajo: ${t.tipo}${t.descripcion?" – "+t.descripcion:""}\n• ${enEquipo(t)?"Técnicos: "+equipoTxt(t):"Técnico: "+(w?w.nombre:"")}\n• Fecha: ${fLarga(d)}\n• Hora: ${hhmm(d)} a ${hhmm(finT(d,t.duracion))} (aprox. ${durTxt(t.duracion)})\n\nDetalles de la visita:\n${linkFor(t.id)}`;

function pendRecordatorios(){
  if(!isAdmin())return [];
  const now=new Date(),lim=addMin(now,60);
  return S.tareas.filter(t=>{if(t.estado!=="programada"||!t.inicio||t.recordatorioEn||!t.trabajadorId)return false;const d=parse(t.inicio);return d>now&&d<=lim}).sort((a,b)=>a.inicio<b.inicio?-1:1);
}
function recCard(t){

let swReg=null;
function notifSoportado(){return "Notification" in window&&window.isSecureContext&&location.protocol!=="file:"}
async function registrarSW(){if(!("serviceWorker" in navigator)||!window.isSecureContext||location.protocol==="file:")return;try{swReg=await navigator.serviceWorker.register("sw.js")}catch(e){swReg=null}}
async function activarNotif(){
  if(!notifSoportado()){toast("Este navegador no permite notificaciones. En iPhone, instale primero la app en la pantalla de inicio.");return}
  let p="default";try{p=await Notification.requestPermission()}catch(e){}
  toast(p==="granted"?"Notificaciones activadas: le avisaremos 1 hora antes de cada tarea.":"No se activaron. Puede habilitarlas en los ajustes del navegador.");
  if(p==="granted")revisarRecordatorios();
  if(sheet)openSheet(Object.assign(sheet,{_keep:true}));else render();
}
function notifEstado(){if(!notifSoportado())return "no";try{return Notification.permission}catch(e){return "no"}}
function revisarRecordatorios(){
  const recs=pendRecordatorios();if(!recs.length)return;
  let vistos;try{vistos=JSON.parse(lsGet("avisados")||"[]")}catch(e){vistos=[]}
  const nuevos=recs.filter(t=>!vistos.includes(t.id+"@"+t.inicio));if(!nuevos.length)return;
  for(const t of nuevos){
    vistos.push(t.id+"@"+t.inicio);
    const w=trab(t.trabajadorId),d=parse(t.inicio);
    const title=`Recordatorio para ${w?w.nombre.split(" ")[0]:"el trabajador"} · ${hhmm(d)}`;
    const body=`${t.tipo} en ${casaTxt(casa(t.casaId))}. Toque para enviarle el WhatsApp.`;
    if(notifEstado()==="granted"){
      const opts={body,tag:"rec-"+t.id,icon:"icon-192.png",badge:"icon-192.png",requireInteraction:true};
      (swReg?swReg.showNotification(title,opts):Promise.reject()).catch(()=>{try{new Notification(title,opts)}catch(e){}});
    }
    toast("🔔 "+title);
  }
  lsSet("avisados",JSON.stringify(vistos.slice(-300)));
  if(route().v==="inicio"&&!sheet)render();
}
setInterval(revisarRecordatorios,30000);

function sheetVerCasa(s){
  const c=casa(s.id);if(!c)return head("Casa eliminada");
  const ts=S.tareas.filter(t=>t.casaId===c.id);
  // una entrada por trabajo: el equipo de un día y los días de una obra se juntan
  const grupos=new Map();ts.forEach(t=>{const k=t.serie||t.grupo||t.id;if(!grupos.has(k))grupos.set(k,[]);grupos.get(k).push(t)});
  const abierto=x=>x.estado==="programada"||x.estado==="por_confirmar";
  const items=[...grupos.values()].map(ms=>{
    ms.sort((a,b)=>(a.inicio||"")<(b.inicio||"")?-1:1);
    const vivos=ms.filter(x=>x.estado!=="cancelada"),base=vivos.length?vivos:ms;
    const t=base.find(abierto)||base[0];
    const est=base.some(abierto)?t.estado:base.every(x=>x.estado==="finalizada")?"finalizada":base.some(x=>x.estado==="pendiente")?"pendiente":t.estado;
    const dias=[...new Set(base.filter(x=>x.inicio).map(x=>x.inicio.slice(0,10)))].sort();
    const ult=ms.map(x=>x.inicio||x.creada||"").sort().pop();
    return {t,est,dias,ult,nota:base.map(x=>x.nota).filter(Boolean).pop()||""};
  }).sort((a,b)=>a.ult<b.ult?1:-1);
  const abiertas=items.filter(i=>i.est==="programada"||i.est==="por_confirmar");
  const cuenta=e=>items.filter(i=>i.est===e).length;
  const reps=S.reportes.filter(r=>r.casaId===c.id);
  const fila=it=>{const t=it.t,est=it.est,d=parse(t.inicio);
    const cuando=it.dias.length>1?`${fCorta(parse(it.dias[0]+"T00:00"))} – ${fCorta(parse(it.dias[it.dias.length-1]+"T00:00"))} · ${it.dias.length} días`:d?`${fCorta(d)} ${d.getFullYear()!==new Date().getFullYear()?d.getFullYear()+" ":""}· ${hhmm(d)}`:"Fecha por definir";
    const nota=it.nota;
    return `<button class="opt" style="text-align:left;width:100%;align-items:flex-start" data-act="det" data-id="${t.id}"><span style="min-width:0"><b>${esc(t.tipo)}</b><br><span class="muted small">${cuando} · ${esc(enEquipo(t)?equipoTxt(t):(trab(t.trabajadorId)?.nombre||"Sin asignar"))}</span>${nota?`<br><span class="small">${esc(nota.length>90?nota.slice(0,90)+"…":nota)}</span>`:t.motivo&&est==="cancelada"?`<br><span class="small muted">Motivo: ${esc(t.motivo)}</span>`:""}</span><span class="pill st-${est}" style="font-size:11px;padding:1px 8px;flex:none">${ESTADO[est]}</span></button>`};
  return head(esc(casaTxt(c)),c.demo?"Casa de ejemplo":"")+`<div class="stack">
  <div class="card"><dl class="kv">${c.propietario?`<dt>Propietario</dt><dd>${esc(c.propietario)}</dd>`:""}${c.telefono?`<dt>Teléfono</dt><dd>${esc(c.telefono)}</dd>`:""}${c.fechaEntrega?`<dt>Entrega</dt><dd>${esc(c.fechaEntrega)}</dd>`:""}<dt>Trabajos</dt><dd>${items.length} en total · ${cuenta("finalizada")} finalizados${cuenta("pendiente")?` · ${cuenta("pendiente")} pendientes`:""}${abiertas.length?` · ${abiertas.length} programados`:""}${cuenta("cancelada")?` · ${cuenta("cancelada")} cancelados`:""}</dd></dl></div>
  ${isAdmin()&&!readOnly?`<button class="btn btn-lime" data-act="nuevacasa" data-id="${c.id}">${I.plus} Nueva tarea para esta casa</button>`:""}
  <div class="stack" style="gap:6px"><h3>Historial de trabajos</h3>${items.length?items.map(fila).join(""):`<div class="card muted small">Aún no hay trabajos registrados en esta casa.</div>`}</div>
  ${reps.length?`<div class="stack" style="gap:6px"><h3>Reportes</h3>${reps.map(r=>`<button class="opt" style="text-align:left;width:100%" data-act="repver" data-id="${r.id}"><span><b>${esc(r.titulo)}</b><br><span class="muted small">${fCorta(new Date(r.creado))} · ${esc(trab(r.trabajadorId)?.nombre||"")}</span></span>${I.next}</button>`).join("")}</div>`:""}

async function addCasas(){
  const cn=document.getElementById("cc-condo").value;const bloque=document.getElementById("cc-bloque").value.trim().toUpperCase();const raw=document.getElementById("cc-num").value.trim();
  if(!bloque){toast("Seleccione o escriba el bloque.");document.getElementById("cc-bloque").focus();return}
  if(BLOQUES[cn]&&!BLOQUES[cn].includes(bloque)){toast("En "+cn+" el bloque va de A a M.");return}
  if(!raw){toast("Indique el número de casa.");document.getElementById("cc-num").focus();return}
  let nums=[raw];const m=raw.match(/^(\d+)\s*-\s*(\d+)$/);
  if(m){const a=+m[1],b=+m[2];if(b<a||b-a>200){toast("Revise el rango (máximo 200 casas a la vez).");return}nums=[];for(let i=a;i<=b;i++)nums.push(String(i))}
  lastCondo=cn;lastBloque=bloque;
  let n=0,dup=0;for(const num of nums){const id=casaId(cn,bloque,num);if(casa(id)){dup++;continue}
    try{await put("casas",id,{condominio:cn,bloque,numero:num,creado:new Date().toISOString()});n++}catch(e){break}}
  if(n){const f=document.getElementById("cc-num");if(f)f.value=""}
  toast(n?`${n===1?"Casa "+nums[0]:n+" casas"} agregada${n===1?"":"s"} al bloque ${bloque} de ${cn}.${dup?" "+dup+" ya existían.":""}`:"Esa casa ya estaba registrada.");
}

function nombreCondoOk(nom,excepto){
  nom=String(nom||"").replace(/\s+/g," ").trim();
  if(!nom){toast("Escriba el nombre del condominio.");return null}
  if(condos().some(c=>c!==excepto&&c.toLowerCase()===nom.toLowerCase())){toast("Ya existe un condominio con ese nombre.");return null}
  return nom;
}

}

  const f=document.getElementById("cn-nom");const nom=nombreCondoOk(f&&f.value);if(!nom){f&&f.focus();return}
  try{await asegurarCondosBase();
    const orden=Math.max(0,...S.condos.map(c=>c.orden||0),condos().length)+1;
    await put("condominios",condoId(nom)+(S.condos.some(c=>c.id===condoId(nom))?"-"+Date.now().toString(36):""),{nombre:nom,orden,creado:new Date().toISOString()});
  }catch(e){return}
  lastCondo=nom;lastBloque="";formOpen.condo=false;formOpen.casas=true;render();
  toast(nom+" agregado. Ahora agregue sus casas.");
}
function sheetEditCondo(s){
  const n=S.casas.filter(c=>c.condominio===s.n).length;
  return head("Renombrar condominio",esc(s.n)+" · "+n+" casas")+`<div class="stack"><div class="field"><label for="ec-cn">Nombre</label><input id="ec-cn" class="in" value="${esc(s.n)}" maxlength="60"></div>
  ${n?`<span class="muted small">El nombre nuevo se aplica a sus ${n} casas. Las tareas y reportes las siguen mostrando con el nombre nuevo.</span>`:""}
  <button class="btn btn-dark" data-act="savecondo">Guardar</button></div>`;
}
async function renombrarCondo(viejo,nuevo){
  if(!viejo)return;const nom=nombreCondoOk(nuevo,viejo);if(!nom)return;
  if(nom===viejo){closeSheet();return}
  try{
    await asegurarCondosBase();
    const reg=S.condos.find(c=>c.nombre===viejo);
    if(reg)await patch("condominios",reg.id,{nombre:nom});
    else await put("condominios",condoId(nom),{nombre:nom,orden:condos().length+1,creado:new Date().toISOString()});
    // en Supabase las casas se actualizan solas (on update cascade); aquí se actualizan una por una
    if(!S.supa||!reg)for(const c of S.casas.filter(x=>x.condominio===viejo))await patch("casas",c.id,{condominio:nom});
  }catch(e){return}
  if(lastCondo===viejo)lastCondo=nom;if(nCondo===viejo)nCondo=nom;
  closeSheet();toast("Condominio renombrado a "+nom+".");
}
async function borrarCondo(nom){
  if(S.casas.some(c=>c.condominio===nom)){toast("Primero elimine o mueva sus casas.");return}
  if(!confirm("¿Eliminar el condominio «"+nom+"»?"))return;
  try{await asegurarCondosBase();const reg=S.condos.find(c=>c.nombre===nom);if(reg)await del("condominios",reg.id)}catch(e){return}
  toast(nom+" eliminado.");
}
async function addTrab(){
  const nom=document.getElementById("tw-nom").value.trim();if(!nom){toast("Escriba el nombre.");return}
  const mail=document.getElementById("tw-mail").value.trim().toLowerCase();
  if(mail&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail)){toast("Revise el correo.");return}
  if(mail&&S.trab.some(t=>String(t.email||"").toLowerCase()===mail)){toast("Ese correo ya lo usa otro trabajador.");return}
  try{await put("trabajadores",uid("w"),{nombre:nom,telefono:document.getElementById("tw-tel").value.trim(),especialidad:document.getElementById("tw-esp").value.trim(),email:mail||null,color:COLORS[S.trab.length%COLORS.length],creado:new Date().toISOString()})}catch(e){return}
  toast(nom+" registrado.");
}
async function cargarDemo(){
  toast("Cargando ejemplo…");
  const nombres=[["Carlos Mora (ejemplo)","Fontanería"],["Luis Jiménez (ejemplo)","Electricidad"],["Andrés Vargas (ejemplo)","Acabados"]];
  const wids=[];for(let i=0;i<nombres.length;i++){const id="wdemo"+i;wids.push(id);await put("trabajadores",id,{nombre:nombres[i][0],especialidad:nombres[i][1],telefono:"",color:COLORS[i],demo:true,creado:new Date(Date.now()+i).toISOString()})}
  const cids=[];for(const cn of CONDOS_BASE){for(const [bl,num] of [["A","12"],["B","27"],["C","41"]]){const id=casaId(cn,bl,num)+"-demo";cids.push(id);await put("casas",id,{condominio:cn,bloque:bl,numero:num,demo:true})}}
  const base=startOfDay(new Date());const plan=[[0,10,0,0,"Fuga de agua / fontanería",90],[0,14,1,4,"Revisión eléctrica",90],[1,8,2,7,"Ajuste de puertas",60],[1,10,0,2,"Filtración en techo",120],[2,13,1,9,"Tomacorriente o apagador",45],[3,8,2,5,"Retoque de pintura",180],[4,10,0,11,"Filtración en techo",120],[8,10,1,3,"Fisura en pared",120],[12,8,2,6,"Filtración en techo",120]];
  for(let i=0;i<plan.length;i++){const [dd,h,w,c,tipo,dur]=plan[i];let d=addMin(addDays(base,dd),h*60);if(d.getDay()===6)d=addDays(d,2);if(d.getDay()===0)d=addDays(d,1);
    await put("tareas","tdemo"+i,{casaId:cids[c],trabajadorId:wids[w],tipo,descripcion:"Tarea de ejemplo",duracion:dur,inicio:toStr(d),estado:"programada",opciones:[],fotos:[],nota:"",demo:true,creada:new Date().toISOString(),historial:[{t:toStr(new Date()),txt:"Creada (ejemplo)"}]})}
  toast("Ejemplo cargado. Puede borrarlo desde el menú.");
}
async function borrarDemo(){
  for(const t of S.tareas.filter(x=>x.demo))await del("tareas",t.id).catch(()=>{});
  for(const c of S.casas.filter(x=>x.demo))await del("casas",c.id).catch(()=>{});
  for(const w of S.trab.filter(x=>x.demo))await del("trabajadores",w.id).catch(()=>{});
  for(const a of S.avisos.filter(x=>String(x.trabajadorId).startsWith("wdemo")))await del("avisos",a.id).catch(()=>{});
  if(String(modo).startsWith("wdemo")){modo="admin";lsSet("modo",modo)}
  closeSheet();toast("Datos de ejemplo eliminados.");
}
