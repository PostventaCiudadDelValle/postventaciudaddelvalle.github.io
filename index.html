<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Programación Postventa</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0E0F0C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Postventa">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Roboto:wght@400;500;700&display=swap">
<style>
/* Layout: una columna tipo app móvil (máx 760px) sobre fondo gris; calendarios a ancho completo con scroll interno */
:root{
  --bg:#F1F2EE; --card:#FFFFFF; --ink:#0E0F0C; --muted:#6A6E64; --line:#E2E4DC;
  --lime:#B5D30F; --lime-ink:#4F6100; --lime-soft:#F0F6D3; --onlime:#0E0F0C;
  --dark:#0E0F0C; --ondark:#FFFFFF;
  --danger:#B93A27; --danger-soft:#FBE9E5; --warn:#A86F00; --warn-soft:#FBF1DA; --ok:#3F7A12; --ok-soft:#E7F2DC;
  --shadow:0 1px 2px rgba(20,24,10,.06),0 6px 18px rgba(20,24,10,.06);
  --f-display:"Manrope",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Roboto",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-lg:22px; --r-md:16px; --r-sm:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E100C; --card:#181B15; --ink:#EEF1E8; --muted:#9BA092; --line:#2A2E25;
  --lime:#C2E021; --lime-ink:#CFEA4D; --lime-soft:#262E0E; --onlime:#0E0F0C;
  --dark:#EEF1E8; --ondark:#0E100C;
  --danger:#F07A63; --danger-soft:#3A1A14; --warn:#E8B44A; --warn-soft:#33270E; --ok:#93CF5C; --ok-soft:#1D2C12;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E100C; --card:#181B15; --ink:#EEF1E8; --muted:#9BA092; --line:#2A2E25;
  --lime:#C2E021; --lime-ink:#CFEA4D; --lime-soft:#262E0E; --onlime:#0E0F0C;
  --dark:#EEF1E8; --ondark:#0E100C;
  --danger:#F07A63; --danger-soft:#3A1A14; --warn:#E8B44A; --warn-soft:#33270E; --ok:#93CF5C; --ok-soft:#1D2C12;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 96px}
.wide{max-width:1180px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:26px;font-weight:800}
h2{font-size:19px;font-weight:800}
h3{font-size:16px;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrapr{flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* botones */
.icon-btn{width:52px;height:52px;border-radius:50%;border:0;background:var(--dark);color:var(--lime);display:grid;place-items:center;flex:none;box-shadow:var(--shadow)}
.icon-btn.light{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none;width:44px;height:44px}
.btn{border:0;border-radius:999px;padding:12px 20px;font-weight:700;display:inline-flex;align-items:center;gap:8px;justify-content:center;min-height:46px}
.btn-lime{background:var(--lime);color:var(--onlime);box-shadow:0 6px 16px color-mix(in srgb,var(--lime) 40%,transparent)}
.btn-dark{background:var(--dark);color:var(--ondark)}
.btn-ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn-danger{background:var(--danger-soft);color:var(--danger)}
.btn-sm{min-height:36px;padding:7px 14px;font-size:13.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
a.btn{text-decoration:none}
.link{background:none;border:0;color:var(--ink);font-weight:700;padding:6px 0;display:inline-flex;gap:6px;align-items:center}

/* cabecera */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.top-logo{height:54px;width:auto;display:block;cursor:pointer;flex:none}
.brand-logo{height:76px;width:auto;display:block;margin:0 auto 10px}
.logo-oscuro{display:none!important}
/* ---------- modo web (computadora): menú fijo a la izquierda y contenido ancho; el celular no cambia ---------- */
.side{display:none}
@media (min-width:1024px){
  .shell{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:100vh}
  .side{display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh;overflow:auto;background:#0E0F0C;color:#fff;padding:22px 14px 16px}
  .side-logo{display:flex;align-items:center;gap:10px;padding:0 8px 6px;cursor:pointer}
  .side-logo img{height:58px;width:auto;flex:none}
  .side-logo span{font:700 13px/1.25 var(--f-display);color:rgba(255,255,255,.72)}
  .side-new{width:100%;justify-content:center;min-height:48px}
  .side-nav{display:flex;flex-direction:column;gap:2px}
  .side-sep{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.45);padding:14px 12px 4px}
  .side-item{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border:0;border-radius:12px;background:none;color:rgba(255,255,255,.86);font:600 14.5px var(--f-body);text-align:left;cursor:pointer}
  .side-item svg{width:20px;height:20px;flex:none}
  .side-item:hover{background:rgba(255,255,255,.08);color:#fff}
  .side-item[aria-current="page"]{background:#B5D30F;color:#0E0F0C}
  .side-badge{background:#B93A27;color:#fff;border-radius:999px;padding:0 7px;font-size:12px;margin-left:4px}
  .side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;border-top:1px solid rgba(255,255,255,.12);padding-top:12px}
  .side-me{display:flex;align-items:center;gap:10px;width:100%;padding:10px;border:0;border-radius:14px;background:rgba(255,255,255,.06);color:#fff;text-align:left;cursor:pointer;font:500 14px var(--f-body)}
  .side-me:hover{background:rgba(255,255,255,.12)}
  .side-me svg{transform:rotate(-90deg);opacity:.7}
  .side-sub{font-size:12px;color:rgba(255,255,255,.6)}
  .main .wrap{max-width:1280px;padding-left:36px;padding-right:36px;padding-top:26px}
  /* el menú y el logo ya están en la barra lateral */
  .shell .main .top .icon-btn[data-act="drawer"],.shell .main .top .icon-btn[data-act="home"],:root .shell .main .top .top-logo{display:none!important}
  .main .top{justify-content:flex-end;min-height:0}
  .main .dd{display:none}
  .main .rem-list{grid-template-columns:repeat(auto-fill,minmax(420px,1fr));align-items:start}
  .main .daylist.rem-list{grid-template-columns:repeat(auto-fill,minmax(360px,1fr))}
  .main .casas-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(440px,1fr));column-gap:32px}
  .main .casas-list .list-item b{white-space:nowrap}
  .sheet{max-width:720px}
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo-claro{display:none!important}:root:not([data-theme="light"]) .logo-oscuro{display:block!important}}
:root[data-theme="dark"] .logo-claro{display:none!important}
:root[data-theme="dark"] .logo-oscuro{display:block!important}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-top:22px}
.hero p{margin:4px 0 0;font-size:17px;color:var(--muted)}
.bell{position:relative}
.bell .dot{position:absolute;top:4px;right:4px;min-width:18px;height:18px;border-radius:9px;background:var(--danger);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.mode-chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px 6px 8px;display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.avatar{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;flex:none}

/* menú desplegable */
.dd{position:relative;margin-top:20px}
.dd-btn{width:100%;background:var(--dark);color:var(--ondark);border:0;border-radius:999px;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:16px;min-height:56px}
.dd-btn svg{transition:transform .2s}
.dd[data-open="1"] .dd-btn svg.chev{transform:rotate(180deg)}
.dd-menu{position:absolute;left:0;right:0;top:calc(100% + 8px);background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:8px;z-index:20}
.dd-item{width:100%;display:flex;align-items:center;gap:14px;border:0;background:none;padding:12px;border-radius:14px;text-align:left}
.dd-item:hover{background:var(--lime-soft)}
.dd-ico{width:44px;height:44px;border-radius:12px;background:var(--dark);color:var(--lime);display:grid;place-items:center;flex:none}
.dd-item b{display:block;font-size:15.5px}
.dd-item .count{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;background:var(--lime-soft);color:var(--lime-ink);border-radius:999px;padding:2px 10px;font-size:13px}

/* tarjetas */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px}
.section{margin-top:26px}
.section-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;gap:10px}
.rem-list{display:grid;gap:12px}
.rem{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 16px 12px;display:grid;gap:10px}
.rem-top{display:flex;gap:12px;align-items:flex-start}
.timebox{background:var(--dark);color:var(--ondark);border-radius:14px;padding:8px 10px;min-width:64px;text-align:center;flex:none}
.timebox b{display:block;font-family:var(--f-display);font-size:18px;line-height:1.1;font-variant-numeric:tabular-nums}
.timebox span{font-size:11px;opacity:.8;text-transform:uppercase;letter-spacing:.05em}
.rem-main{min-width:0;flex:1}
.rem-main h3{margin-bottom:2px}
.meta{display:flex;gap:6px 14px;flex-wrap:wrap;color:var(--muted);font-size:13.5px}
.meta span{display:inline-flex;align-items:center;gap:5px}
.rem-actions{display:flex;gap:8px;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:10px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 11px;font-size:12.5px;font-weight:600;border:1.5px solid;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st-programada{color:var(--lime-ink);border-color:var(--lime);background:transparent}
.st-por_confirmar{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 50%,transparent);background:var(--warn-soft)}
.st-finalizada{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent);background:var(--ok-soft)}
.st-pendiente{color:var(--warn);border-color:var(--warn);background:var(--warn-soft)}
.st-cancelada{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,transparent);background:var(--danger-soft)}
.soon{font-size:12.5px;font-weight:700;color:var(--lime-ink)}
.soon.cur{color:var(--ok)}
.soon.cur::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;margin-right:6px;vertical-align:1px;animation:pv-pulso 1.6s ease-in-out infinite}
.soon.rep{color:var(--warn)}
@keyframes pv-pulso{50%{opacity:.25}}

.bars{display:grid;gap:10px}
.bar-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:14px}
.bar{grid-column:1/-1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--lime);border-radius:4px}

.empty{text-align:center;padding:28px 18px}
.empty p{margin:6px auto 16px;max-width:42ch;color:var(--muted)}

/* calendarios */
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:18px}
.cal-nav{display:flex;align-items:center;gap:8px}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px}
.seg button{border:0;background:none;border-radius:999px;padding:8px 14px;font-weight:600;color:var(--muted);font-size:14px}
.seg button[aria-pressed="true"]{background:var(--dark);color:var(--ondark)}
.scroller{overflow-x:auto;margin-top:14px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--card)}
.grid-time{display:grid;position:relative}
.colhead{position:sticky;top:0;background:var(--card);z-index:3;border-bottom:1px solid var(--line);padding:10px 8px;font-size:13px;font-weight:700;text-align:center;min-height:52px;display:flex;flex-direction:column;justify-content:center}
.colhead small{font-weight:500;color:var(--muted)}
.colhead.today{color:var(--lime-ink)}
.colhead.today b{background:var(--lime);color:var(--onlime);border-radius:999px;padding:0 8px}
.gutter{border-right:1px solid var(--line)}
.hour{height:var(--hh);font-size:11.5px;color:var(--muted);text-align:right;padding:0 6px;transform:translateY(-7px);font-variant-numeric:tabular-nums}
.col{position:relative;border-left:1px solid var(--line)}
.col .hl{height:var(--hh);border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.col.off{background:repeating-linear-gradient(135deg,transparent 0 8px,color-mix(in srgb,var(--line) 45%,transparent) 8px 9px)}
.ev{position:absolute;border-radius:10px;padding:5px 7px;font-size:12px;line-height:1.25;overflow:hidden;border:1px solid;text-align:left;color:var(--ink)}
.ev b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.ev.tent{border-style:dashed}
.ev.done{opacity:.65}
.ev.cancel{opacity:.45;text-decoration:line-through}
.brk{position:absolute;left:0;right:0;pointer-events:none;background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--warn) 9%,transparent) 0 6px,transparent 6px 12px);border-block:1px dashed color-mix(in srgb,var(--warn) 30%,transparent)}
.brk span{display:block;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--warn);padding:2px 6px;opacity:.85}
.nowline{position:absolute;left:0;right:0;height:2px;background:var(--danger);z-index:2}
.nowline::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--danger)}

.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:var(--card);margin-top:14px}
.month .dow{padding:8px 6px;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:center}
.mday{min-height:104px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:3px;background:none;border-top:0;border-left:0;text-align:left;min-width:0}
.mday.other{background:color-mix(in srgb,var(--bg) 60%,transparent)}
.mday.other .dn{color:var(--muted);opacity:.6}
.mday .dn{font-weight:700;font-size:13px;font-variant-numeric:tabular-nums;width:26px;height:26px;display:grid;place-items:center;border-radius:50%}
.mday.today .dn{background:var(--lime);color:var(--onlime)}
.chip{font-size:11.5px;border-radius:6px;padding:2px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:1px solid}
.more{font-size:11.5px;color:var(--muted);font-weight:600}
.dots{display:none;gap:3px;flex-wrap:wrap}
.dots i{width:7px;height:7px;border-radius:50%}
@media (max-width:620px){.mday{min-height:62px;padding:4px}.mday .chip,.mday .more{display:none}.dots{display:flex}.mcount{display:block}}
.legend{display:flex;gap:8px 16px;flex-wrap:wrap;margin-top:12px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:4px;border:1px solid}
.daylist{margin-top:18px}

/* hoja inferior */
.scrim{position:fixed;inset:0;background:rgba(10,12,8,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding-block:10px calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:26px;max-height:88vh}}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.field{display:grid;gap:6px}
.field label,.lbl{font-size:13px;font-weight:700}
.in{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;min-height:48px}
textarea.in{min-height:84px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.two{grid-template-columns:1fr}}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.vercomo>summary{list-style:none;cursor:pointer}
.vercomo>summary::-webkit-details-marker{display:none}
.vercomo .vc-chev{display:inline-flex;transition:transform .2s}
.vercomo[open] .vc-chev{transform:rotate(180deg)}
.choice{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px}
.choice[aria-pressed="true"]{background:var(--dark);color:var(--ondark);border-color:var(--dark)}
.alert{border-radius:14px;padding:10px 12px;font-size:13.5px}
.alert.bad{background:var(--danger-soft);color:var(--danger)}
.alert.okk{background:var(--ok-soft);color:var(--ok)}
.alert.info{background:var(--lime-soft);color:var(--lime-ink)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 14px;font-size:14.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;border:1px solid var(--line);max-width:100%}
.ph{position:relative}
.ph-x{position:absolute;top:4px;right:4px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(17,17,17,.78);color:#fff;display:grid;place-items:center;cursor:pointer;padding:0}
.ph-x svg{width:16px;height:16px}
.rep-txt{white-space:pre-wrap;line-height:1.55}
.msgbox{white-space:pre-wrap;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;font-size:14px;user-select:text}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.hist{border-left:2px solid var(--line);padding-left:12px;display:grid;gap:6px;font-size:13px}
.drawer-item{display:flex;gap:12px;align-items:center;width:100%;padding:13px 10px;border:0;background:none;border-radius:12px;font-weight:600;text-align:left}
.drawer-item:hover{background:var(--card)}
.list-item{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--dark);color:var(--ondark);padding:12px 18px;border-radius:999px;font-weight:600;z-index:80;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:14px;padding:10px 14px;font-size:13.5px;margin-top:12px}
.fab{position:fixed;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30}
.owner{max-width:600px;margin:0 auto}
.daygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.daycard{display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-md);padding:12px 12px 10px;text-align:left;min-height:118px;transition:border-color .15s,transform .15s}
.daycard:not(:disabled):hover{border-color:var(--lime);transform:translateY(-1px)}
.daycard:disabled{opacity:.5;cursor:not-allowed;background:transparent}
.daycard .dname{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.daycard .dnum{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1.05}
.daycard .dmon{font-size:13px;color:var(--muted)}
.daycard .dav{margin-top:auto;font-size:12px;font-weight:700;color:var(--lime-ink);background:var(--lime-soft);border-radius:999px;padding:2px 8px}
.daycard .dav.none{color:var(--muted);background:var(--bg)}
.slotgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
.slot{display:flex;flex-direction:column;align-items:flex-start;gap:1px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;text-align:left}
.slot b{font-size:15.5px}
.slot span{font-size:12.5px;color:var(--muted)}
.slot em{font-style:normal;font-size:11.5px;font-weight:700;color:var(--danger)}
.slot:disabled{opacity:.45;cursor:not-allowed;background:transparent}
.slot:disabled b{text-decoration:line-through}
.slot[aria-pressed="true"]{background:var(--dark);border-color:var(--dark);color:var(--ondark)}
.slot[aria-pressed="true"] span{color:inherit;opacity:.75}
.confirmbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--lime-soft);border:1.5px solid var(--lime);border-radius:var(--r-md);padding:12px 14px}
.icon-btn:disabled{opacity:.35;cursor:not-allowed}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800}
.brand i{width:36px;height:36px;border-radius:10px;background:var(--dark);color:var(--lime);display:grid;place-items:center;font-style:normal}
/* ---------- celular ---------- */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,a,label,.in{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.in{font-size:16px}   /* 16px evita que el iPhone haga zoom al tocar un campo */
/* la columna de horas queda fija al deslizar entre trabajadores */
.grid-time>.gutter{position:sticky;left:0;z-index:4;background:var(--card)}
.grid-time>.colhead.gutter{z-index:5}
/* semana en formato agenda (solo celular) */
.wk-list{display:grid;gap:18px;margin-top:16px}
.wk-head{display:flex;align-items:center;gap:8px;width:100%;padding:0 2px 8px;margin-bottom:10px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left}
.wk-head b{font-family:var(--f-display);font-size:22px;line-height:1.2;font-variant-numeric:tabular-nums;border-radius:999px}
.wk-dn{font-weight:700;text-transform:uppercase;font-size:12px;letter-spacing:.06em;color:var(--muted)}
.wk-day.today .wk-head b{background:var(--lime);color:var(--onlime);padding:0 10px}
.wk-free{font-size:13.5px;color:var(--muted);padding:0 2px}
@media (max-width:640px){
  .wrap{padding-block:12px 88px}
  h1{font-size:24px}
  .hero{margin-top:16px}
  .hero .btn-lime{width:100%}
  .rem{padding:14px 14px 10px}
  .rem-top{gap:10px}
  .timebox{min-width:58px;padding:7px 8px}
  .timebox b{font-size:17px}
  .rem-main>.row.between{flex-direction:column-reverse;align-items:flex-start;gap:4px}
  .rem-main h3{font-size:15.5px}
  .rem-actions .btn{flex:1 1 calc(50% - 4px);padding-inline:8px}
  .rem-actions .btn-rec,.rem-actions .btn-wide{flex-basis:100%}
  .btn-sm{min-height:42px}
  .cal-head{margin-top:14px}
  .cal-head h1{font-size:22px}
  .seg button{padding:8px 12px}
  .sheet{max-height:94vh;max-height:94dvh}
  .kv{grid-template-columns:1fr;gap:2px}
  .kv dd{margin-bottom:8px}
  .section{margin-top:22px}
}
/* selector de hora tipo reloj */
.clock-in{display:flex;align-items:center;gap:10px;text-align:left;font-weight:600;font-variant-numeric:tabular-nums}
.clock-in svg{color:var(--muted);flex:none}
.ck-scrim{position:fixed;inset:0;background:rgba(10,12,8,.55);z-index:70;display:grid;place-items:center;padding:16px}
.ck{background:var(--card);border-radius:var(--r-lg);width:100%;max-width:330px;overflow:hidden;box-shadow:var(--shadow);display:grid;gap:14px;padding-bottom:16px}
.ck>p,.ck>.row{margin-inline:16px}
.ck-head{background:var(--dark);color:var(--ondark);padding:16px 18px}
.ck-time{display:flex;align-items:center;gap:4px;margin-top:6px;font-family:var(--f-display);font-weight:800;font-size:44px;line-height:1}
.ck-seg{border:0;background:transparent;color:inherit;opacity:.6;border-radius:14px;padding:4px 8px;font:inherit;min-width:74px;font-variant-numeric:tabular-nums}
.ck-seg[aria-pressed="true"]{background:var(--lime);color:var(--onlime);opacity:1}
.ck-ap{margin-left:auto;display:grid;gap:5px}
.ck-ap button{border:1.5px solid color-mix(in srgb,var(--ondark) 35%,transparent);background:transparent;color:inherit;border-radius:10px;padding:4px 10px;font:600 13px var(--f-body);opacity:.75}
.ck-ap button[aria-pressed="true"]{background:var(--lime);border-color:var(--lime);color:var(--onlime);opacity:1}
.ck-dial{position:relative;justify-self:center;width:min(256px,calc(100% - 32px));aspect-ratio:1;border-radius:50%;background:var(--bg);touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer}
.ck-hand{position:absolute;inset:0;width:100%;height:100%}
.ck-hand line{stroke:var(--lime);stroke-width:2.5}
.ck-hand circle{fill:var(--lime)}
.ck-n{position:absolute;width:40px;height:40px;margin:-20px 0 0 -20px;display:grid;place-items:center;border-radius:50%;font-weight:600;font-size:15px;pointer-events:none;font-variant-numeric:tabular-nums;z-index:1}
.ck-n.off{opacity:.28}
.ck-n.sel{color:var(--onlime);font-weight:800;opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="layer"></div>
<div id="clockbox"></div>

// ---------- utilidades de fecha ----------
function pad(n){return String(n).padStart(2,"0")}
function startOfDay(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function addMin(d,n){return new Date(d.getTime()+n*60000)}
function enDescanso(d){const m=d.getHours()*60+d.getMinutes();return DESCANSOS.some(([a,b])=>m>=a&&m<b)}
// hora real de fin: el trabajo se detiene durante los descansos que atraviesa
function finT(d,dur){let f=addMin(d,dur);const m0=d.getHours()*60+d.getMinutes();for(const [a,b] of DESCANSOS){const bs=new Date(d.getFullYear(),d.getMonth(),d.getDate(),0,a);if(m0<a&&f>bs)f=addMin(f,b-a)}return f}
function dkey(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function toStr(d){return dkey(d)+"T"+pad(d.getHours())+":"+pad(d.getMinutes())}
function parse(s){if(!s)return null;const [a,b]=s.split("T");const [y,m,dd]=a.split("-").map(Number);const [h,mi]=(b||"00:00").split(":").map(Number);return new Date(y,m-1,dd,h,mi)}
function hhmm(d){let h=d.getHours(),m=d.getMinutes();const ap=h<12?"a. m.":"p. m.";h=h%12||12;return h+":"+pad(m)+" "+ap}
function hhmmShort(d){let h=d.getHours(),m=d.getMinutes();h=h%12||12;return h+":"+pad(m)}
function fLarga(d){return DIAS[d.getDay()].replace("Mié","Miércoles").replace("Lun","Lunes").replace("Mar","Martes").replace("Jue","Jueves").replace("Vie","Viernes").replace("Sáb","Sábado").replace("Dom","Domingo")+" "+d.getDate()+" de "+MESES[d.getMonth()]}
function fCorta(d){return DIAS[d.getDay()]+" "+d.getDate()+" "+MESES[d.getMonth()].slice(0,3)}
function sameDay(a,b){return a&&b&&a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate()}
function weekStart(d){const x=startOfDay(d);const w=(x.getDay()+6)%7;return addDays(x,-w)}
function durTxt(m){if(m===JORNADA)return "Jornada completa";if(m<60)return m+" min";const h=Math.floor(m/60),r=m%60;return h+" h"+(r?" "+r+" min":"")}
function rel(d,fin){const now=new Date(),diff=(d-now)/60000;
  if(diff<=0){if(!fin||now<fin)return {t:"En curso"+(fin?" · hasta "+hhmm(fin):""),cls:"cur"};return {t:"Falta registrar avance",cls:"rep"}}if(diff<60)return {t:"En "+Math.max(0,Math.round(diff))+" min"};if(diff<60*24&&sameDay(d,new Date()))return {t:"En "+Math.round(diff/60)+" h"};const days=Math.round((startOfDay(d)-startOfDay(new Date()))/864e5);if(days===1)return {t:"Mañana"};return {t:"En "+days+" días"}}

// ---------- datos ----------
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function casa(id){return S.casas.find(c=>c.id===id)}
function trab(id){return S.trab.find(t=>t.id===id)}
function casaTxt(c){return c?c.condominio+(c.bloque?" · Bloque "+c.bloque:"")+" · Casa "+c.numero:"Casa eliminada"}
function casaId(cn,bl,num){return (cn+"-"+bl+"-"+num).toLowerCase().normalize("NFD").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")}
// condominios: los registrados (en su orden) + cualquier nombre que ya usen las casas
function condos(){
  const reg=S.condos.slice().sort((a,b)=>(a.orden??100)-(b.orden??100)||String(a.nombre).localeCompare(String(b.nombre),"es")).map(c=>c.nombre);
  const base=reg.length?reg:CONDOS_BASE.slice();
  S.casas.forEach(c=>{if(c.condominio&&!base.includes(c.condominio))base.push(c.condominio)});
  return base;
}
function condoId(n){return "cn-"+String(n).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")}
let lastCondo=CONDOS_BASE[0],lastBloque="";
const BLOQUES = {"Valle Novarum":"ABCDEFGHIJKLM".split("")};
function bloqueInput(id,cn,val){
  const lista=BLOQUES[cn];
  if(lista)return `<select id="${id}" class="in"><option value="">Seleccione el bloque…</option>${lista.map(b=>`<option value="${b}" ${b===String(val||"").toUpperCase()?"selected":""}>Bloque ${b}</option>`).join("")}</select>`;
  return `<input id="${id}" class="in" placeholder="Ej. A" value="${esc(val||"")}" autocapitalize="characters">`;
}

function conflictos(tid,inicioStr,dur,excludeId){
  const a=parse(inicioStr), b=finT(a,dur);const ex=[].concat(excludeId==null?[]:excludeId);
  return S.tareas.filter(t=>!ex.includes(t.id)&&t.inicio&&t.trabajadorId===tid&&(t.estado==="programada"||t.estado==="por_confirmar")).filter(t=>{
    const s=parse(t.inicio), e=finT(s,t.duracion||60);return s<b&&e>a});
}
function fueraJornada(inicioStr,dur){const a=parse(inicioStr),b=finT(a,dur);const ha=a.getHours()+a.getMinutes()/60,hb=b.getHours()+b.getMinutes()/60;return a.getDay()===0||a.getDay()===6||ha<WORK0||ha>ULTIMA||enDescanso(a)||!sameDay(a,b)||hb>WORK1}
function proximoLibre(tid,desde,dur,excludeId){
  let d=new Date(desde);d.setSeconds(0,0);const m=d.getMinutes();if(m%30)d=addMin(d,30-m%30);
  for(let i=0;i<60*24;i++){
    const s=toStr(d);
    // tid puede ser un trabajador o una lista (equipo): todos deben estar libres
    if(!fueraJornada(s,dur)&&[].concat(tid).every(w=>!conflictos(w,s,dur,excludeId).length)&&d>new Date())return s;
    d=addMin(d,30);
  }
  return null;
}
// ---------- trabajo en equipo: varias tareas enlazadas por "grupo", una por trabajador ----------
function grupoDe(t){if(!t)return [];if(!t.grupo)return [t];return S.tareas.filter(x=>x.grupo===t.grupo&&(x.id===t.id||x.estado!=="cancelada"))}
function abiertosGrupo(t){return grupoDe(t).filter(x=>x.id===t.id||x.estado==="programada"||x.estado==="por_confirmar")}
function enEquipo(t){return grupoDe(t).length>1}
function listaY(n){return n.length<2?(n[0]||""):n.slice(0,-1).join(", ")+" y "+n[n.length-1]}
function equipoTxt(t){const n=grupoDe(t).map(x=>trab(x.trabajadorId)?.nombre).filter(Boolean);return n.length?listaY(n):"Sin asignar"}
function companerosTxt(t){return listaY(grupoDe(t).filter(x=>x.id!==t.id).map(x=>trab(x.trabajadorId)?.nombre).filter(Boolean))}
// una sola tarjeta por equipo en las listas de administración
function unicos(list){const seen=new Set();return list.filter(t=>{if(!t.grupo)return true;if(seen.has(t.grupo))return false;seen.add(t.grupo);return true})}
// choques de todo el equipo a esa hora (tw = trabajador nuevo para la tarea t, si se reasigna)
function conflictosEquipo(t,s,dur,tw){const ms=abiertosGrupo(t),ex=ms.map(x=>x.id);return ms.map(m=>m.id===t.id?(tw||m.trabajadorId):m.trabajadorId).flatMap(w=>conflictos(w,s,dur,ex))}
function trabEquipo(t,tw){return abiertosGrupo(t).map(m=>m.id===t.id?(tw||m.trabajadorId):m.trabajadorId)}
// ---------- obras de varios días: una tarea por día (y por trabajador), enlazadas por "serie" ----------
const MAX_DIAS=10;
function sigHabil(d){let y=addDays(d,1);while(y.getDay()===0||y.getDay()===6)y=addDays(y,1);return y}
// n inicios en días hábiles seguidos, a la misma hora
function diasHabiles(s,n){const out=[];let d=parse(s);for(let i=0;i<n;i++){out.push(toStr(d));d=sigHabil(d)}return out}
function serieDe(t){if(!t||!t.serie)return [t];return S.tareas.filter(x=>x.serie===t.serie&&(x.id===t.id||x.estado!=="cancelada"))}
function diasDe(t){return [...new Set(serieDe(t).filter(x=>x.inicio).map(x=>x.inicio.slice(0,10)))].sort()}
function enSerie(t){return !!(t&&t.serie)&&diasDe(t).length>1}
function diaTxt(t){if(!enSerie(t)||!t.inicio)return "";const ds=diasDe(t);return "Día "+(ds.indexOf(t.inicio.slice(0,10))+1)+" de "+ds.length}
// una tarea representativa por día (la primera del equipo de ese día)
function porDiaSerie(t){const m=new Map();serieDe(t).filter(x=>x.inicio).sort((a,b)=>a.inicio<b.inicio?-1:1).forEach(x=>{const k=x.inicio.slice(0,10);if(!m.has(k))m.set(k,x)});return [...m.values()]}
function fechasSerieTxt(t){return porDiaSerie(t).map(x=>{const d=parse(x.inicio);return `• ${fLarga(d)}, de ${hhmm(d)} a ${hhmm(finT(d,x.duracion))}`}).join("\n")}
// qué tareas se mueven y a qué hora: solo este día (con su equipo) u "obra" = este día y los siguientes
function movimientos(t,s,alcance,tw){
  if(alcance!=="obra"||!enSerie(t)){const ms=s!==t.inicio?abiertosGrupo(t):[t];return ms.map(m=>({m,s,w:m.id===t.id?(tw||m.trabajadorId):m.trabajadorId}))}
  const abiertos=serieDe(t).filter(x=>x.inicio&&(x.estado==="programada"||x.estado==="por_confirmar")&&x.inicio.slice(0,10)>=t.inicio.slice(0,10));
  const dias=[...new Set(abiertos.map(x=>x.inicio.slice(0,10)))].sort(),nuevos=diasHabiles(s,dias.length);
  return abiertos.map(m=>({m,s:nuevos[dias.indexOf(m.inicio.slice(0,10))],w:m.trabajadorId}));
}
function chequeoMov(moves){const ex=moves.map(x=>x.m.id);return {cf:moves.flatMap(x=>conflictos(x.w,x.s,x.m.duracion,ex)),fuera:moves.some(x=>fueraJornada(x.s,x.m.duracion))}}
function proximoMov(t,desde,alcance){
  if(alcance!=="obra"||!enSerie(t))return proximoLibre(trabEquipo(t),desde,t.duracion,abiertosGrupo(t).map(x=>x.id));
  let d=new Date(desde);d.setSeconds(0,0);const m=d.getMinutes();if(m%30)d=addMin(d,30-m%30);
  for(let i=0;i<60*24;i++){const s=toStr(d);if(d>new Date()&&!fueraJornada(s,t.duracion)){const c=chequeoMov(movimientos(t,s,"obra"));if(!c.cf.length&&!c.fuera)return s}d=addMin(d,30)}
  return null;
}
function conflictMsgF(list){return list.map(t=>{const s=parse(t.inicio);return `${esc(casaTxt(casa(t.casaId)))} el ${fCorta(s)} (${hhmm(s)}–${hhmm(finT(s,t.duracion))})`}).join(", ")}
function proximoLibreDias(ids,desde,dur,n){
  let d=new Date(desde);d.setSeconds(0,0);const m=d.getMinutes();if(m%30)d=addMin(d,30-m%30);
  for(let i=0;i<60*24;i++){const s=toStr(d);
    if(d>new Date()&&!fueraJornada(s,dur)&&diasHabiles(s,n).every(f=>[].concat(ids).every(w=>!conflictos(w,f,dur).length)))return s;
    d=addMin(d,30)}
  return null;
}
function conflictMsg(list){return list.map(t=>{const s=parse(t.inicio);return `${esc(casaTxt(casa(t.casaId)))} (${hhmm(s)}–${hhmm(finT(s,t.duracion))})`}).join(", ")}

// ---------- modo local (HTML abierto fuera de claude.ai): guarda en este navegador ----------
const LKEY="pv_db";
function localDb(){
  let persist=true;try{localStorage.setItem("pv_t","1");localStorage.removeItem("pv_t")}catch(e){persist=false}
  S.memOnly=!persist;   // algunos visores no permiten guardar: se trabaja en memoria y se avisa
  let data;try{data=JSON.parse(localStorage.getItem(LKEY)||"{}")}catch(e){data={}}
  const subs=[];
  const copy=v=>v===undefined?undefined:JSON.parse(JSON.stringify(v));
  function save(){if(!persist)return;try{localStorage.setItem(LKEY,JSON.stringify(data))}catch(e){const er=new Error("Sin espacio en el navegador");er.code="quota_exceeded";throw er}}
  function snapCol(col){const m=data[col]||{};return {docs:Object.keys(m).map(id=>({id,data:()=>copy(m[id])})),metadata:{fromCache:false}}}
  function snapDoc(col,id){const v=(data[col]||{})[id];return {exists:!!v,data:()=>copy(v)}}
  function emit(col){subs.forEach(s=>{if(col==null||s.col===col)s.cb(s.id==null?snapCol(s.col):snapDoc(s.col,s.id))})}
  function write(col,id,fn){const prev=(data[col]||{})[id];data[col]=data[col]||{};fn();try{save()}catch(e){if(prev===undefined)delete data[col][id];else data[col][id]=prev;throw e}emit(col)}
  function docRef(col,id){return {
    set:async d=>write(col,id,()=>{data[col][id]=copy(d)}),
    update:async d=>{if(!(data[col]||{})[id]){const e=new Error("No existe");e.code="not_found";throw e}write(col,id,()=>{data[col][id]=Object.assign({},data[col][id],copy(d))})},
    delete:async()=>write(col,id,()=>{delete data[col][id]}),
    onSnapshot:cb=>{const s={col,id,cb};subs.push(s);setTimeout(()=>cb(snapDoc(col,id)),0);return ()=>subs.splice(subs.indexOf(s),1)}
  }}
  // si la app está abierta en dos pestañas, se mantienen al día
  window.addEventListener("storage",e=>{if(e.key!==LKEY)return;try{data=JSON.parse(e.newValue||"{}")}catch(er){data={}}emit(null)});
  return {
    collection:col=>({doc:id=>docRef(col,id),onSnapshot:cb=>{const s={col,id:null,cb};subs.push(s);setTimeout(()=>cb(snapCol(col)),0);return ()=>subs.splice(subs.indexOf(s),1)}}),
    doc:path=>{const [c,i]=path.split("/");return docRef(c,i)},
    exportar:()=>JSON.stringify({app:"postventa",version:1,exportado:new Date().toISOString(),datos:data},null,1),
    importar:obj=>{const prev=data;data=obj||{};try{save()}catch(e){data=prev;throw e}emit(null)}
  };
}

// ---------- base de datos en línea (Supabase) ----------
// Imita la misma interfaz que usa el resto de la app (collection/doc/onSnapshot) y traduce los nombres de campos.
const COLS={
  condominios:["id","nombre","orden","creado"],
  casas:["id","condominio","bloque","numero","propietario","telefono","fecha_entrega","demo","creado"],
  trabajadores:["id","nombre","telefono","especialidad","color","email","demo","creado"],
  tareas:["id","casa_id","trabajador_id","tipo","descripcion","duracion","inicio","estado","fotos","nota","motivo","historial","creada","reportado_en","recordatorio_en","grupo","serie","demo"],
  avisos:["id","trabajador_id","tarea_id","reporte_id","texto","creado","leido"],
  reportes:["id","titulo","texto","casa_id","trabajador_id","fotos","creado","actualizado","enviado_en","demo"],
  config:["id","telefono"]
};
const toSnake=k=>k.replace(/[A-Z]/g,c=>"_"+c.toLowerCase());
const toCamel=k=>k.replace(/_([a-z])/g,(m,c)=>c.toUpperCase());
function toRow(col,obj){const r={};for(const [k,v] of Object.entries(obj||{})){const s=toSnake(k);if(COLS[col].includes(s)&&v!==undefined)r[s]=v}return r}
function fromRow(row){const o={};for(const [k,v] of Object.entries(row)){if(k==="rango")continue;o[toCamel(k)]=v}if(typeof o.inicio==="string")o.inicio=o.inicio.slice(0,16);return o}
function supaErr(e){
  const er=new Error((e&&e.message)||"Error");const c=e&&e.code;
  er.code=c==="23P01"?"choque":c==="23514"?"jornada":(c==="42501"||/row-level security/i.test(er.message))?"permiso":(c||"error");
  return er;
}
function supaDb(sb){
  const cache={},subs=[],timers={},watched=new Set();
  const onErr=(col,e)=>subs.filter(s=>s.col===col).forEach(s=>s.err&&s.err(e));
  async function fetchCol(col){
    let all=[],from=0;
    for(;;){const {data,error}=await sb.from(col).select("*").range(from,from+999);if(error)throw supaErr(error);all=all.concat(data);if(data.length<1000)break;from+=1000}
    cache[col]=all;emit(col);
  }
  const plain=r=>{const o=fromRow(r);delete o.id;return o};
  function snap(col){return {docs:(cache[col]||[]).map(r=>({id:r.id,data:()=>plain(r)})),metadata:{fromCache:false}}}
  function snapDoc(col,id){const r=(cache[col]||[]).find(x=>x.id===id);return {exists:!!r,data:()=>r?plain(r):undefined}}
  function emit(col){subs.forEach(s=>{if(s.col===col)s.cb(s.id==null?snap(col):snapDoc(col,s.id))})}
  function refetch(col,ms){clearTimeout(timers[col]);timers[col]=setTimeout(()=>fetchCol(col).catch(e=>onErr(col,e)),ms==null?250:ms)}
  function watch(col){
    if(watched.has(col))return;watched.add(col);
    sb.channel("pv-"+col).on("postgres_changes",{event:"*",schema:"public",table:col},()=>refetch(col)).subscribe();
    fetchCol(col).catch(e=>onErr(col,e));
  }
  function sub(col,id,cb,err){const s={col,id,cb,err};subs.push(s);if(cache[col])setTimeout(()=>emit(col),0);watch(col);return ()=>subs.splice(subs.indexOf(s),1)}
  async function done(col,p){const {error}=await p;if(error)throw supaErr(error);await fetchCol(col).catch(()=>{})}
  function docRef(col,id){return {
    set:d=>done(col,sb.from(col).upsert(Object.assign(toRow(col,d),{id}))),
    update:d=>done(col,sb.from(col).update(toRow(col,d)).eq("id",id)),
    delete:()=>done(col,sb.from(col).delete().eq("id",id)),
    onSnapshot:(cb,err)=>sub(col,id,cb,err)
  }}
  // respaldo por si el tiempo real se corta
  setInterval(()=>watched.forEach(c=>refetch(c)),120000);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)watched.forEach(c=>refetch(c))});
  return {
    collection:col=>({doc:id=>docRef(col,id),onSnapshot:(cb,err)=>sub(col,null,cb,err)}),
    doc:path=>{const [c,i]=path.split("/");return docRef(c,i)},
    exportar:()=>JSON.stringify({app:"postventa",version:1,exportado:new Date().toISOString(),datos:Object.fromEntries(Object.keys(COLS).map(c=>[c,Object.fromEntries((cache[c]||[]).map(r=>{const o=plain(r);delete o.token;return [r.id,o]}))]))},null,1),
    importar:async datos=>{
      for(const col of ["condominios","casas","trabajadores","tareas","reportes","avisos","config"]){
        const rows=Object.entries(datos[col]||{}).map(([id,o])=>Object.assign(toRow(col,o),{id}));
        for(let i=0;i<rows.length;i+=200){const {error}=await sb.from(col).upsert(rows.slice(i,i+200));if(error)throw supaErr(error)}
        if(rows.length)await fetchCol(col).catch(()=>{});
      }
    }
  };
}

    if(!session){S.needLogin=true;render();return}
    if(!(await cargarPerfil(session)))return;
    timer=setTimeout(()=>{if(!S.loaded.tareas){S.offline=true;render()}},10000);
  }
  else if(!window.claude||!claude.use){db=localDb();assets=localAssets();S.local=true}
  else{
    timer=setTimeout(()=>{if(!S.loaded.tareas){S.offline=true;render()}},10000);
    try{user=await claude.use("user")}catch(e){user=null}
    try{db=await claude.use("db")}catch(e){db=null}
    try{assets=await claude.use("assets")}catch(e){assets=null}
    if(user){try{const c=await user.can("data.write");canWrite=c}catch(e){}}
    if(canWrite===false)readOnly=true;
    if(!db){clearTimeout(timer);S.noDb=true;render();return}
  }
  const sub=(col,key,mapf)=>db.collection(col).onSnapshot(snap=>{
    S[key]=snap.docs.map(d=>Object.assign({id:d.id},d.data()));if(mapf)mapf();
    if(!snap.metadata.fromCache){S.loaded[key]=true;if(key==="tareas"){clearTimeout(timer);S.offline=false}}
    else S.loaded[key]=S.loaded[key]||snap.docs.length>0;
    onData(key);
  },err=>{if(key==="tareas"){clearTimeout(timer);S.offline=true;render()}});
  sub("condominios","condos");
  sub("casas","casas",()=>{const L=condos();S.casas.sort((a,b)=>a.condominio!==b.condominio?L.indexOf(a.condominio)-L.indexOf(b.condominio):(String(a.bloque||"").localeCompare(String(b.bloque||""),undefined,{numeric:true})||String(a.numero).localeCompare(String(b.numero),undefined,{numeric:true})))});
  sub("trabajadores","trab",()=>S.trab.sort((a,b)=>(a.creado||"")<(b.creado||"")?-1:1));
  sub("tareas","tareas");
  sub("avisos","avisos",()=>S.avisos.sort((a,b)=>a.creado<b.creado?1:-1));
  sub("reportes","reportes",()=>S.reportes.sort((a,b)=>(a.creado||"")<(b.creado||"")?1:-1));
  db.doc("config/general").onSnapshot(s=>{S.config=s.exists?s.data():{};render()},()=>{});
}
let seenAvisos=null;
function onData(key){
  if(key==="avisos"&&modo!=="admin"){
    const mine=S.avisos.filter(a=>a.trabajadorId===modo&&!a.leido);
    if(seenAvisos){const nuevos=mine.filter(a=>!seenAvisos.has(a.id));if(nuevos.length)toast("🔔 "+nuevos[0].texto)}
    seenAvisos=new Set(mine.map(a=>a.id));
  }
  render();
  if(sheet&&sheet.kind==="detalle"&&!document.querySelector("#layer :focus")&&!sheet.dirty)openSheet(sheet);
  if(key==="tareas")revisarRecordatorios();
}
async function put(col,id,data){
  if(!db||readOnly){toast("No tiene permiso para guardar cambios.");throw new Error("ro")}
  try{await db.collection(col).doc(id).set(data)}catch(e){handleErr(e);throw e}
}
async function patch(col,id,data){
  if(!db||readOnly){toast("No tiene permiso para guardar cambios.");throw new Error("ro")}
  try{await db.collection(col).doc(id).update(data)}catch(e){handleErr(e);throw e}
}
async function del(col,id){try{await db.collection(col).doc(id).delete()}catch(e){handleErr(e);throw e}}
function handleErr(e){
  if(e&&e.code==="invalid_argument"&&canWrite==null){readOnly=true;toast("Su acceso es de solo lectura.");render();return}
  if(e&&e.code==="quota_exceeded"){toast("Se llenó el espacio de datos. Elimine registros antiguos.");return}
  if(e&&e.code==="choque"){toast("Ese horario choca con otro trabajo del trabajador.");return}
  if(e&&e.code==="jornada"){toast("Ese horario está fuera de la jornada de trabajo.");return}
  if(e&&e.code==="permiso"){toast("Su usuario no tiene permiso para ese cambio.");return}
  if(e&&e.code==="23505"){toast("Ya existe un registro con ese dato (por ejemplo, el mismo correo).");return}
  toast("No se pudo guardar. Intente de nuevo.");
}
function hist(t,txt){return (t.historial||[]).concat([{t:toStr(new Date()),txt}]).slice(-30)}
async function aviso(tarea,texto){
  if(!tarea.trabajadorId)return;
  try{await put("avisos",uid("a"),{trabajadorId:tarea.trabajadorId,tareaId:tarea.id,texto,creado:new Date().toISOString(),leido:false})}catch(e){}
}

function viewInicio(){

  const ws=weekStart(hoy);const nSem=unicos(enRango(list,ws,addDays(ws,7))).length;
  const ms=new Date(hoy.getFullYear(),hoy.getMonth(),1);const nMes=unicos(enRango(list,ms,new Date(hoy.getFullYear(),hoy.getMonth()+1,1))).length;
  const t=modo!=="admin"?trab(modo):null;

  const ready=S.loaded.tareas||S.noDb||S.offline;
  const needSetup=ready&&isAdmin()&&(!S.casas.length||!S.trab.length);
  let h=`<div class="wrap">${topbar("","",false)}
  <div class="hero"><div><h1>${t?"Hola, "+esc(t.nombre.split(" ")[0]):"Programación"}</h1><p class="num">${nHoy} ${nHoy===1?"trabajo":"trabajos"} hoy · ${nSem} esta semana</p></div>

  // más repetidos
  if(isAdmin()){
    const cnt={};unicos(activas(S.tareas)).forEach(x=>{cnt[x.tipo]=(cnt[x.tipo]||0)+1});
    const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,5);
    if(top.length){const max=top[0][1];
      h+=`<div class="section"><div class="section-head"><h2>Trabajos que más se repiten</h2><span class="muted small">Todas las fechas</span></div><div class="card bars">${top.map(([n,v])=>`<div class="bar-row"><span>${esc(n)}</span><b class="num">${v}</b><div class="bar"><i style="width:${Math.round(v/max*100)}%"></i></div></div>`).join("")}<p class="muted small" style="margin:4px 0 0">Úselo para detectar fallas recurrentes del proceso constructivo.</p></div></div>`}
  }
  if(needSetup)h+=`<div class="section row wrapr between card" style="padding:12px 16px"><span class="muted small">Registro: <b class="num">${S.casas.length}</b> casas · <b class="num">${S.trab.length}</b> trabajadores</span><span class="row" style="gap:14px"><button class="link small" data-act="go" data-h="casas">Casas ${I.next}</button><button class="link small" data-act="go" data-h="equipo">Equipo ${I.next}</button>${!S.casas.length&&!S.trab.length&&!readOnly&&db?`<button class="link small muted" data-act="demo">Cargar ejemplo</button>`:""}</span></div>`;
  h+=`</div>`;
  return h;
}

// ---------- calendarios ----------
function calHeader(title,sub,step){
  return `<div class="cal-head"><div><h1 style="text-transform:none">${title}</h1><div class="muted">${sub}</div></div>
  <div class="cal-nav"><button class="icon-btn light" data-act="step" data-n="-${step}" aria-label="Anterior">${I.back}</button><button class="btn btn-ghost btn-sm" data-act="hoy">Hoy</button><button class="icon-btn light" data-act="step" data-n="${step}" aria-label="Siguiente">${I.next}</button></div></div>
  <div class="row between wrapr" style="margin-top:14px"><div class="seg" role="group" aria-label="Vista">${["dia","semana","mes"].map(v=>`<button aria-pressed="${route().v===v}" data-act="go" data-h="${v}">${{dia:"Día",semana:"Semana",mes:"Mes"}[v]}</button>`).join("")}</div>
  ${isAdmin()?`<button class="btn btn-lime btn-sm" data-act="nueva" data-fecha="${dkey(fecha)}">${I.plus} Nueva tarea</button>`:""}</div>`;
}
function layoutLanes(items){
  const sorted=items.slice().sort((a,b)=>a.inicio<b.inicio?-1:1);const lanes=[];
  sorted.forEach(t=>{const s=parse(t.inicio);let i=lanes.findIndex(e=>e<=s);if(i<0){i=lanes.length;lanes.push(0)}lanes[i]=finT(s,t.duracion||60);t._lane=i});
  return {items:sorted,n:Math.max(1,lanes.length)};
}
function evHtml(t,n){
  const s=parse(t.inicio);const top=((s.getHours()+s.getMinutes()/60)-H0)*HH;const hgt=Math.max(26,(finT(s,t.duracion||60)-s)/36e5*HH-3);
  const w=100/n;const c=casa(t.casaId);const cls=t.estado==="por_confirmar"?"tent":t.estado==="finalizada"?"done":t.estado==="cancelada"?"cancel":"";
  return `<button class="ev ${cls}" data-act="det" data-id="${t.id}" style="top:${top}px;height:${hgt}px;left:calc(${t._lane*w}% + 3px);width:calc(${w}% - 6px);${evStyle(t.trabajadorId)}"><b>${hhmmShort(s)} ${esc(c?c.condominio.replace("Valle ","")+" "+c.numero:"")}</b><span>${esc(t.tipo)}${enSerie(t)?" · "+diaTxt(t):""}</span>${hgt>60?`<span>${esc(trab(t.trabajadorId)?.nombre||"")}</span>`:""}</button>`;
}
function timeGrid(cols,minColW){
  // cols: [{head, items, off, today}]
  const hours=[];for(let h=H0;h<H1;h++)hours.push(h);
  const nowD=new Date();
  let h=`<div class="scroller"><div class="grid-time" style="--hh:${HH}px;grid-template-columns:54px repeat(${cols.length},minmax(${minColW}px,1fr));min-width:${54+cols.length*minColW}px">`;
  h+=`<div class="colhead gutter"></div>`+cols.map(c=>`<div class="colhead ${c.today?"today":""}">${c.head}</div>`).join("");
  h+=`<div class="gutter">${hours.map(x=>`<div class="hour">${x===H0?"":(x%12||12)+(x<12?" am":" pm")}</div>`).join("")}</div>`;
  cols.forEach(c=>{
    const L=layoutLanes(c.items);
    h+=`<div class="col ${c.off?"off":""}">${hours.map(()=>`<div class="hl"></div>`).join("")}${c.off?"":DESCANSOS.map(([a,b,n])=>`<div class="brk" style="top:${(a/60-H0)*HH}px;height:${(b-a)/60*HH}px"><span>${n}</span></div>`).join("")}${L.items.map(t=>evHtml(t,L.n)).join("")}${c.today&&nowD.getHours()>=H0&&nowD.getHours()<H1?`<div class="nowline" style="top:${((nowD.getHours()+nowD.getMinutes()/60)-H0)*HH}px"></div>`:""}</div>`;
  });
  return h+`</div></div>`;
}
function legend(list){
  const ids=[...new Set(list.map(t=>t.trabajadorId))].filter(Boolean);

  return `<div class="legend">${ids.map(id=>`<span><i style="${evStyle(id)}"></i>${esc(trab(id)?.nombre||"—")}</span>`).join("")}<span><i style="border-style:dashed;border-color:var(--muted)"></i>Esperando propietario</span></div>`;
}

function remCardLite(t){const d=parse(t.inicio),c=casa(t.casaId);return `<button class="rem" style="text-align:left;width:100%" data-act="det" data-id="${t.id}"><div class="rem-top"><div class="timebox"><b>${hhmmShort(d)}</b><span>${d.getHours()<12?"a. m.":"p. m."}</span></div><div class="rem-main"><div class="row between" style="align-items:flex-start"><h3>${esc(casaTxt(c))}</h3><span class="pill st-${t.estado}">${ESTADO[t.estado]}</span></div><div style="font-weight:600;margin:2px 0 4px">${esc(t.tipo)}</div><div class="meta"><span>${enEquipo(t)?I.team:I.user}${esc(equipoTxt(t))}</span><span>${I.clock}${durTxt(t.duracion)} · hasta ${hhmm(finT(d,t.duracion))}</span>${enSerie(t)?`<span><b>${diaTxt(t)}</b></span>`:""}</div></div></div></button>`}

function viewDia(){

function viewSemana(){
  const ws=weekStart(fecha);const items=enRango(vis(),ws,addDays(ws,7));
  const cols=[];for(let i=0;i<7;i++){const d=addDays(ws,i);cols.push({head:`${DIAS[d.getDay()]} <b class="num">${d.getDate()}</b>`,items:items.filter(t=>sameDay(parse(t.inicio),d)),today:sameDay(d,new Date()),off:d.getDay()===0,d})}
  const we=addDays(ws,6);
  if(esMovil()){
    // en el celular la semana se muestra como agenda por día (sin deslizar de lado)
    let body="";
    for(const c of cols){
      const d=c.d,its=unicos(c.items),n=its.filter(t=>t.estado!=="cancelada").length;
      if(!its.length&&(d.getDay()===0||d.getDay()===6))continue;
      body+=`<div class="wk-day ${c.today?"today":""}"><button class="wk-head" data-act="mday" data-d="${dkey(d)}" aria-label="Ver ${fLarga(d)}"><span class="wk-dn">${["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"][d.getDay()]}</span><b>${d.getDate()}</b><span class="muted small">${MESES[d.getMonth()]}</span><span class="muted small num" style="margin-left:auto">${n?n+(n===1?" trabajo":" trabajos"):""}</span>${I.next}</button>${its.length?`<div class="rem-list">${its.map(remCardLite).join("")}</div>`:`<div class="wk-free">Sin trabajos programados.</div>`}</div>`;
    }
    return `<div class="wrap">${topbar("","",true)}${calHeader("Semana del "+ws.getDate()+(ws.getMonth()!==we.getMonth()?" de "+MESES[ws.getMonth()]:"")+" al "+we.getDate()+" de "+MESES[we.getMonth()],unicos(items.filter(t=>t.estado!=="cancelada")).length+" trabajos programados",7)}<div class="wk-list">${body}</div></div>`;
  }
  return `<div class="wrap wide">${topbar("","",true)}${calHeader("Semana del "+ws.getDate()+(ws.getMonth()!==we.getMonth()?" de "+MESES[ws.getMonth()]:"")+" al "+we.getDate()+" de "+MESES[we.getMonth()],unicos(items.filter(t=>t.estado!=="cancelada")).length+" trabajos programados",7)}${timeGrid(cols,118)}${legend(items)}</div>`;
}
function viewMes(){
  const m0=new Date(fecha.getFullYear(),fecha.getMonth(),1);const m1=new Date(fecha.getFullYear(),fecha.getMonth()+1,1);
  const start=weekStart(m0);const items=enRango(vis(),start,addDays(start,42));
  let cells="";
  for(let i=0;i<42;i++){
    const d=addDays(start,i);if(i>=35&&d>=m1)break;
    const dAll=items.filter(t=>sameDay(parse(t.inicio),d)&&t.estado!=="cancelada"),di=unicos(dAll);
    cells+=`<button class="mday ${d.getMonth()!==m0.getMonth()?"other":""} ${sameDay(d,new Date())?"today":""}" data-act="mday" data-d="${dkey(d)}" aria-label="${fLarga(d)}, ${di.length} trabajos"><span class="dn">${d.getDate()}</span>
      ${di.slice(0,3).map(t=>{const c=casa(t.casaId);return `<span class="chip" style="${evStyle(t.trabajadorId)}${t.estado==="por_confirmar"?";border-style:dashed":""}">${hhmmShort(parse(t.inicio))} ${esc(c?c.condominio.replace("Valle ","")+" "+c.numero:"")}</span>`}).join("")}
      ${di.length>3?`<span class="more">+${di.length-3} más</span>`:""}
      <span class="dots">${dAll.slice(0,6).map(t=>`<i style="background:${color(t.trabajadorId)}"></i>`).join("")}</span></button>`;
  }
  const n=unicos(items.filter(t=>parse(t.inicio)>=m0&&parse(t.inicio)<m1&&t.estado!=="cancelada")).length;
  return `<div class="wrap wide">${topbar("","",true)}${calHeader(MESES[m0.getMonth()].replace(/^./,c=>c.toUpperCase())+" "+m0.getFullYear(),n+" trabajos programados · toque un día para verlo",0)}
  <div class="month">${["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"].map(x=>`<div class="dow">${x}</div>`).join("")}${cells}</div>${legend(items)}</div>`;
}

// ---------- selector de día y hora (propietario) ----------
const ownerP={week:null,day:null,slot:null,sent:null};
function weekDays(off){const ws=addDays(weekStart(new Date()),7*off);return [0,1,2,3,4].map(i=>addDays(ws,i))}
function slotsFor(t,day){
  const out=[];for(let h=WORK0;h<=ULTIMA;h++){
    let st=new Date(day.getFullYear(),day.getMonth(),day.getDate(),h,0);
    // si la hora cae en un descanso, se ofrece al terminar el descanso (12:00 → 1:00 p. m.)
    if(enDescanso(st)){const dsc=DESCANSOS.find(([a,b])=>h*60>=a&&h*60<b);st=new Date(day.getFullYear(),day.getMonth(),day.getDate(),0,dsc[1]);if(st.getMinutes()===0)continue}
    const str=toStr(st);if(fueraJornada(str,t.duracion))continue;
    const past=st<addMin(new Date(),60);const fin=addMin(st,t.duracion);
    const busy=!past&&(t.demo?(day.getDate()*3+h)%5===0:t.ocupado?t.ocupado.some(([a,b])=>parse(a)<fin&&parse(b)>st):conflictosEquipo(t,str,t.duracion).length>0);
    out.push({s:str,d:st,ok:!past&&!busy,why:past?"No disponible":busy?"Ocupado":""});
  }
  return out;
}
function pickerHtml(t,P,ctx){
  if(P.week==null){P.week=0;for(let k=0;k<4;k++){if(weekDays(k).some(d=>slotsFor(t,d).some(x=>x.ok))){P.week=k;break}}}
  if(P.slot&&!slotsFor(t,parse(P.slot)).some(x=>x.s===P.slot&&x.ok))P.slot=null;
  if(P.sent)return P.sent;
  const days=weekDays(P.week);
  if(!P.day){
    const a=days[0],b=days[4];
    return `<div class="stack"><div class="row between wrapr"><div><span class="eyebrow">Paso 1 de 2</span><h2 style="margin-top:2px">Elija el día</h2></div>
    <div class="cal-nav"><button class="icon-btn light" data-act="pkweek" data-n="-1" aria-label="Semana anterior" ${P.week<=0?"disabled":""}>${I.back}</button><span class="small num" style="font-weight:700;min-width:118px;text-align:center">${a.getDate()} ${MESES[a.getMonth()].slice(0,3)} – ${b.getDate()} ${MESES[b.getMonth()].slice(0,3)}</span><button class="icon-btn light" data-act="pkweek" data-n="1" aria-label="Semana siguiente" ${P.week>=7?"disabled":""}>${I.next}</button></div></div>
    <div class="daygrid">${days.map(d=>{const sl=slotsFor(t,d);const n=sl.filter(x=>x.ok).length;return `<button class="daycard" data-act="pkday" data-d="${dkey(d)}" ${n?"":"disabled"} aria-label="${fLarga(d)}, ${n} horarios disponibles"><span class="dname">${["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"][d.getDay()]}</span><span class="dnum num">${d.getDate()}</span><span class="dmon">${MESES[d.getMonth()]}</span><span class="dav ${n?"":"none"}">${n?n+(n===1?" horario libre":" horarios libres"):d<startOfDay(new Date())?"Ya pasó":"Sin espacio"}</span></button>`}).join("")}</div>
    <p class="muted small" style="margin:0">Horario de visitas: ${HORARIO_TXT}. El trabajo toma aprox. ${durTxt(t.duracion)}.</p></div>`;
  }
  const day=parse(P.day+"T00:00");const sl=slotsFor(t,day);const sel=P.slot?parse(P.slot):null;
  return `<div class="stack"><div class="row between wrapr"><div><span class="eyebrow">Paso 2 de 2</span><h2 style="margin-top:2px">${fLarga(day)}</h2></div><button class="btn btn-ghost btn-sm" data-act="pkback">${I.back} Cambiar día</button></div>
  <p class="muted small" style="margin:0">Elija el bloque de ${durTxt(t.duracion)} en que prefiere la visita.</p>
  <div class="slotgrid">${sl.map(x=>`<button class="slot" data-act="pkslot" data-s="${x.s}" aria-pressed="${x.s===P.slot}" ${x.ok?"":"disabled"}><b class="num">${hhmm(x.d)}</b><span>hasta ${hhmm(finT(x.d,t.duracion))}</span>${x.ok?"":`<em>${x.why}</em>`}</button>`).join("")}</div>
  ${sel?`<div class="confirmbar"><div><span class="eyebrow">Su elección</span><div style="font-weight:700">${fLarga(sel)}</div><div class="num">${hhmm(sel)} a ${hhmm(finT(sel,t.duracion))}</div></div><button class="btn btn-lime" data-act="pkconfirm" data-id="${t.id}">${ctx==="owner"?"Confirmar visita":"Guardar horario y avisar"}</button></div>`:""}</div>`;
}
function curP(){return sheet&&sheet.kind==="picker"?sheet.P:ownerP}
function rerenderPicker(){if(sheet&&sheet.kind==="picker")openSheet(Object.assign(sheet,{_keep:true}));else render()}
async function pickConfirm(id){
  if(id==="demo"){const P=ownerP,od=parse(P.slot);P.sent=`<div class="card stack"><span class="pill st-programada" style="align-self:start">Visita confirmada</span><h2>${fLarga(od)}</h2><p style="margin:0" class="num">De ${hhmm(od)} a ${hhmm(finT(od,DEMO_T.duracion))} · Técnico: Carlos Mora</p><p class="muted small" style="margin:0">Así se ve la confirmación. En una visita real, la tarea pasa a "Programada" en el calendario y el trabajador recibe el aviso.</p><button class="btn btn-ghost btn-sm" style="align-self:start" data-act="pkreset">Probar otra vez</button></div>`;render();return}
  if(CITA&&CITA.data&&CITA.data.id===id&&!(sheet&&sheet.kind==="picker")){
    // propietario: guarda directo en la base de datos por medio de su enlace secreto
    const P=ownerP,tok=CITA.data._token;if(!P.slot)return;
    const {error}=await sb.rpc("cita_elegir",{p_token:tok,p_inicio:P.slot});
    P.slot=null;P.day=null;
    if(error){toast(error.message||"No se pudo confirmar. Intente de nuevo.");cargarCita(tok);return}
    toast("¡Listo! Su visita quedó confirmada.");cargarCita(tok);return;
  }
  const t=S.tareas.find(x=>x.id===id);const P=curP();if(!t||!P.slot)return;const s=P.slot,od=parse(s);
  if(conflictosEquipo(t,s,t.duracion).length||fueraJornada(s,t.duracion)){toast("Ese horario acaba de ocuparse. Elija otro.");P.slot=null;rerenderPicker();return}
  const admin=sheet&&sheet.kind==="picker";
  if(db&&!readOnly&&canWrite!==false){
    try{
      // el horario elegido aplica a todo el equipo
      for(const m of abiertosGrupo(t)){
        await db.collection("tareas").doc(m.id).update({inicio:s,estado:"programada",opciones:[],historial:hist(m,(admin?"Horario anotado: ":"El propietario eligió ")+fCorta(od)+" "+hhmm(od))});
        await aviso(m,`Confirmado: ${m.tipo} en ${casaTxt(casa(m.casaId))}, ${fCorta(od)} ${hhmm(od)}`);
      }
      if(admin){toast("Horario guardado. Avise al propietario.");openSheet({kind:"mensaje",id})}else{toast("¡Listo! Su visita quedó confirmada.");render()}
      return}catch(e){if(admin)return}
  }
  const txt=`Hola, para la visita de ${t.tipo} en ${casaTxt(casa(t.casaId))} elijo: ${fLarga(od)}, de ${hhmm(od)} a ${hhmm(finT(od,t.duracion))}.`;const tel=S.config.telefono;
  P.sent=`<div class="card stack"><h2>Envíenos su elección</h2><p class="muted" style="margin:0">Para terminar, envíe este mensaje al equipo de postventa.</p><div class="msgbox" id="o-msg">${esc(txt)}</div><div class="row wrapr"><button class="btn btn-dark btn-sm" data-act="copy" data-t="o-msg">Copiar</button>${tel?`<a class="btn btn-lime btn-sm" href="${esc(wa(tel,txt))}" target="_blank" rel="noopener">Enviar por WhatsApp</a>`:""}<button class="btn btn-ghost btn-sm" data-act="pkreset">Elegir otro horario</button></div>${tel?`<span class="muted small">WhatsApp de postventa: <b style="user-select:all">${esc(tel)}</b></span>`:""}</div>`;
  render();
}

// ---------- selector de hora tipo reloj ----------
let CK=null, ckDrag=false;
const CKR=100, CKC=128;   // radio de los números y centro (en un reloj de 256)
function clockField(id,val){return `<input type="hidden" id="${id}" value="${esc(val||"")}"><button type="button" class="in clock-in" id="${id}-btn" data-act="clock" data-for="${id}" aria-haspopup="dialog">${I.clock}<span>${clockTxt(val)}</span></button>`}
function clockTxt(v){if(!v)return "Elegir hora";const [h,m]=v.split(":").map(Number);return hhmm(new Date(2000,0,1,h,m))}
function syncClock(id){const i=document.getElementById(id),b=document.getElementById(id+"-btn");if(i&&b)b.querySelector("span").textContent=clockTxt(i.value)}
const MINS=[0,5,10,15,20,25,30,35,40,45,50,55];
function minOk(h,m){return (h<ULTIMA||m===0)&&!enDescanso(new Date(2000,0,3,h,m))}
function horaOk(h){return h>=WORK0&&h<=ULTIMA&&MINS.some(m=>minOk(h,m))}
function ajustaMin(){if(CK&&!minOk(CK.h,CK.m)){const m=MINS.find(x=>minOk(CK.h,x));CK.m=m==null?0:m}}
function openClock(id){
  const v=document.getElementById(id)?.value||"08:00";let [h,m]=v.split(":").map(Number);
  if(isNaN(h))h=8;if(isNaN(m))m=0;m=Math.round(m/5)*5;if(m===60){m=0;h++}
  if(!horaOk(h))h=h<WORK0?WORK0:h>ULTIMA?ULTIMA:h+1;
  CK={for:id,h,m,mode:"h"};ajustaMin();renderClock();document.getElementById("ck-dial")?.focus();
}
function closeClock(){CK=null;ckDrag=false;renderClock()}
function ckPos(i){const a=i*Math.PI/6;return [CKC+CKR*Math.sin(a),CKC-CKR*Math.cos(a)]}
function ckIdx(){return CK.mode==="h"?CK.h%12:CK.m/5}
function renderClock(){
  const box=document.getElementById("clockbox");if(!CK){box.innerHTML="";return}
  const pm=CK.h>=12;let nums="";
  for(let i=0;i<12;i++){const [x,y]=ckPos(i);let lab,off;
    if(CK.mode==="h"){const hv=i||12;lab=hv;off=!horaOk((hv%12)+(pm?12:0))}else{lab=pad(i*5);off=!minOk(CK.h,i*5)}
    nums+=`<span class="ck-n ${off?"off":""}" data-i="${i}" style="left:${x/2.56}%;top:${y/2.56}%">${lab}</span>`}
  box.innerHTML=`<div class="ck-scrim" data-act="ckclose"><div class="ck" role="dialog" aria-modal="true" aria-label="Elegir hora">
    <div class="ck-head"><span class="eyebrow" style="color:inherit;opacity:.75">${CK.mode==="h"?"Elija la hora":"Elija los minutos"}</span>
      <div class="ck-time"><button type="button" class="ck-seg" id="ck-hh" data-act="ckmode" data-m="h" aria-pressed="${CK.mode==="h"}" aria-label="Hora"></button><span>:</span><button type="button" class="ck-seg" id="ck-mm" data-act="ckmode" data-m="m" aria-pressed="${CK.mode==="m"}" aria-label="Minutos"></button>
      <div class="ck-ap"><button type="button" data-act="ckap" data-v="am" aria-pressed="${!pm}">a. m.</button><button type="button" data-act="ckap" data-v="pm" aria-pressed="${pm}">p. m.</button></div></div></div>
    <div class="ck-dial" id="ck-dial" tabindex="0" role="slider" aria-label="${CK.mode==="h"?"Hora":"Minutos"}; use las flechas y Enter">
      <svg class="ck-hand" viewBox="0 0 256 256" aria-hidden="true"><line id="ck-line" x1="${CKC}" y1="${CKC}" x2="${CKC}" y2="${CKC}"/><circle cx="${CKC}" cy="${CKC}" r="4"/><circle id="ck-knob" cx="${CKC}" cy="${CKC}" r="20"/></svg>${nums}</div>
    <p class="muted small" style="margin-block:0;text-align:center">Toque o arrastre la aguja. Inicio de 6 a. m. a 5 p. m.; no se puede iniciar en el almuerzo (12 m. a 1 p. m.).</p>
    <div class="row" style="justify-content:flex-end"><button type="button" class="btn btn-ghost btn-sm" data-act="ckcancel">Cancelar</button><button type="button" class="btn btn-lime btn-sm" data-act="ckok">Aceptar</button></div>
  </div></div>`;
  updateDial();
}
function updateDial(){
  if(!CK)return;const i=ckIdx(),[x,y]=ckPos(i);
  const l=document.getElementById("ck-line"),k=document.getElementById("ck-knob");if(!l)return;
  l.setAttribute("x2",x);l.setAttribute("y2",y);k.setAttribute("cx",x);k.setAttribute("cy",y);
  document.querySelectorAll(".ck-n").forEach(n=>n.classList.toggle("sel",+n.dataset.i===i));
  document.getElementById("ck-hh").textContent=CK.h%12||12;document.getElementById("ck-mm").textContent=pad(CK.m);
  document.getElementById("ck-dial").setAttribute("aria-valuetext",clockTxt(pad(CK.h)+":"+pad(CK.m)));
}
function ckSet(i){
  if(CK.mode==="h"){const h24=((i||12)%12)+(CK.h>=12?12:0);if(!horaOk(h24))return false;CK.h=h24;ajustaMin()}
  else{if(!minOk(CK.h,i*5))return false;CK.m=i*5}
  updateDial();return true;
}
function ckFromPoint(e){
  const r=document.getElementById("ck-dial").getBoundingClientRect();
  const dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);if(Math.hypot(dx,dy)<14)return;
  let deg=Math.atan2(dx,-dy)*180/Math.PI;if(deg<0)deg+=360;ckSet(Math.round(deg/30)%12);
}
function ckAccept(){
  const id=CK.for,i=document.getElementById(id);if(i)i.value=pad(CK.h)+":"+pad(CK.m);
  closeClock();syncClock(id);if(id==="n-hora")checkNueva();else if(id==="h-hora")checkHora();
  document.getElementById(id+"-btn")?.focus();
}
document.addEventListener("pointerdown",e=>{const d=e.target.closest("#ck-dial");if(!d||!CK)return;ckDrag=true;try{d.setPointerCapture(e.pointerId)}catch(er){}ckFromPoint(e);e.preventDefault()});
document.addEventListener("pointermove",e=>{if(ckDrag&&CK)ckFromPoint(e)});
document.addEventListener("pointerup",()=>{if(!ckDrag)return;ckDrag=false;if(CK&&CK.mode==="h")setTimeout(()=>{if(CK&&CK.mode==="h"){CK.mode="m";renderClock()}},200)});
document.addEventListener("pointercancel",()=>{ckDrag=false});

/* Selector de casa en pasos: condominio → bloque → casa */
let nCondo="",nBloque="";
function ordNum(a,b){return String(a).localeCompare(String(b),"es",{numeric:true,sensitivity:"base"})}
function bloquesDe(cn){return [...new Set(S.casas.filter(c=>c.condominio===cn).map(c=>c.bloque||""))].sort(ordNum)}

function sheetNueva(s){
  const p=s.pre||{};const base=p.fecha?parse(p.fecha+"T08:00"):null;
  const def=base&&base>new Date()?toStr(base):(proximoLibre(p.trabajadorId||S.trab[0]?.id||"",new Date(),60)||toStr(addMin(startOfDay(addDays(new Date(),1)),8*60)));

    <div class="field"><span class="lbl">¿Cuántos días?</span><div class="row wrapr" style="gap:10px;align-items:center"><div class="seg" role="group" id="n-dias-seg"><button type="button" data-act="ndias" data-m="1" aria-pressed="true">Un día</button><button type="button" data-act="ndias" data-m="n" aria-pressed="false">Varios días</button></div>
      <select id="n-dias" class="in" hidden aria-label="Cantidad de días" style="width:auto;min-width:120px">${Array.from({length:MAX_DIAS-1},(_,i)=>i+2).map(n=>`<option value="${n}">${n} días</option>`).join("")}</select></div></div>
    <div class="field"><span class="lbl" id="n-dur-lbl">Tiempo estimado</span><div class="choices" id="n-dur">${DUR.map(m=>`<button type="button" class="choice" data-act="dur" data-m="${m}" aria-pressed="${m===(p.duracion||120)}">${durTxt(m)}</button>`).join("")}</div></div>
    <div class="field"><span class="lbl">¿Quién define la fecha?</span><div class="seg" role="group"><button type="button" data-act="nmodo" data-m="fija" aria-pressed="true">Asignar ahora</button><button type="button" data-act="nmodo" data-m="prop" aria-pressed="false">Que elija el propietario</button></div></div>
    <div id="n-fija" class="two"><div class="field"><label for="n-fecha">Fecha</label><input id="n-fecha" type="date" class="in" value="${dd}"></div><div class="field"><label for="n-hora-btn">Hora</label>${clockField("n-hora",tt)}</div></div>

function nuevaVals(){
  const f=document.getElementById("fnueva");if(!f)return null;
  const dur=+(f.querySelector("#n-dur [aria-pressed=true]")?.dataset.m||120);
  const prop=!document.getElementById("n-prop").hidden;
  const opciones=[];
  const inicio=prop?null:(f.querySelector("#n-fecha").value&&f.querySelector("#n-hora").value?f.querySelector("#n-fecha").value+"T"+f.querySelector("#n-hora").value:null);
  const ids=[...new Set([f.querySelector("#n-trab").value,...[...f.querySelectorAll(".n-trab-x")].map(x=>x.value)].filter(Boolean))];
  const varios=f.querySelector('#n-dias-seg [data-m="n"]')?.getAttribute("aria-pressed")==="true";
  const dias=varios&&!prop?(+f.querySelector("#n-dias").value||2):1;
  return {casaId:f.querySelector("#n-casa").value,trabajadorId:ids[0]||"",trabajadorIds:ids,tipo:f.querySelector("#n-tipo").value,descripcion:f.querySelector("#n-desc").value.trim(),duracion:dur,prop,opciones,inicio,dias,fechas:inicio?diasHabiles(inicio,dias):[]};
}
function checkNueva(){
  syncClock("n-hora");
  const v=nuevaVals();const out=document.getElementById("n-check");if(!v||!out)return;
  let msgs=[],ok=true;
  const pd=document.getElementById("n-prop-dur");if(pd)pd.textContent=durTxt(v.duracion);
  if(v.duracion>(WORK1-WORK0)*60-DESCANSOS.reduce((n,[a,b])=>n+b-a,0)){ok=false;msgs.push(`<div class="alert bad">La duración supera la jornada de un día.</div>`)}
  const dl=document.getElementById("n-dur-lbl");if(dl)dl.textContent=v.dias>1?"Tiempo estimado por día":"Tiempo estimado";
  if(!v.prop&&v.trabajadorId&&v.inicio&&v.dias>1){
    // obra de varios días: la misma hora en días hábiles seguidos; todos deben estar libres todos los días
    const s=v.inicio,ids=v.trabajadorIds,fs=v.fechas;
    const ocupados=ids.map(w=>({w,cf:fs.flatMap(f=>conflictos(w,f,v.duracion))})).filter(x=>x.cf.length);
    const nx=()=>proximoLibreDias(ids,parse(s),v.duracion,v.dias);
    const usar=n=>n?` <button type="button" class="link" style="color:inherit;text-decoration:underline" data-act="usarlibre" data-s="${n}">Empezar ${fCorta(parse(n))}, ${hhmm(parse(n))}</button>`:"";
    if(parse(s)<new Date()){ok=false;msgs.push(`<div class="alert bad">Esa hora ya pasó.</div>`)}
    else if(fueraJornada(s,v.duracion)){ok=false;msgs.push(`<div class="alert bad">Fuera del horario de trabajo: ${HORARIO_TXT}.${usar(nx())}</div>`)}
    else if(ocupados.length){ok=false;msgs.push(`<div class="alert bad">${ocupados.map(o=>`${esc(trab(o.w).nombre.split(" ")[0])} ya tiene ${conflictMsgF(o.cf)}`).join(". ")}. Próximo espacio donde ${ids.length>1?"todos están libres":"está libre"} los ${v.dias} días:${usar(nx())||" no hay en las próximas semanas."}</div>`)}
    else{const a=parse(fs[0]),b=parse(fs[fs.length-1]);msgs.push(`<div class="alert okk">Libre${ids.length>1?" para todo el equipo":""} los ${v.dias} días hábiles: del ${fCorta(a)} al ${fCorta(b)}, cada día de ${hhmm(a)} a ${hhmm(finT(a,v.duracion))} (sábados y domingos no se trabaja).</div>`)}
  }
  else if(!v.prop&&v.trabajadorId&&v.inicio){
    const s=v.inicio,ids=v.trabajadorIds;
    const ocupados=ids.map(w=>({w,cf:conflictos(w,s,v.duracion)})).filter(x=>x.cf.length);
    if(parse(s)<new Date()){ok=false;msgs.push(`<div class="alert bad">Esa hora ya pasó.</div>`)}
    else if(fueraJornada(s,v.duracion)){ok=false;const nx=proximoLibre(ids,parse(s),v.duracion);msgs.push(`<div class="alert bad">Fuera del horario de trabajo: ${HORARIO_TXT}.${nx?` <button type="button" class="link" style="color:inherit;text-decoration:underline" data-act="usarlibre" data-s="${nx}">Usar ${fCorta(parse(nx))}, ${hhmm(parse(nx))}</button>`:""}</div>`)}
    else if(ocupados.length){ok=false;const nx=proximoLibre(ids,parse(s),v.duracion);msgs.push(`<div class="alert bad">${ocupados.map(o=>`${esc(trab(o.w).nombre.split(" ")[0])} ya tiene ${conflictMsg(o.cf)}`).join(". ")}.${nx&&ids.length>1?` Próximo espacio donde todos están libres:`:""}${nx?` <button type="button" class="link" style="color:inherit;text-decoration:underline" data-act="usarlibre" data-s="${nx}">Usar ${fCorta(parse(nx))}, ${hhmm(parse(nx))}</button>`:""}</div>`)}
    else msgs.push(`<div class="alert okk">Horario libre${v.trabajadorIds.length>1?" para todo el equipo":""}: ${hhmm(parse(s))} – ${hhmm(finT(parse(s),v.duracion))}</div>`);
  }
  out.innerHTML=msgs.join("");out.className=msgs.length?"stack":"";
  const eq=v.trabajadorIds.length>1;
  const btn=document.getElementById("n-save");if(btn){btn.disabled=!ok||!v.casaId||!v.trabajadorId||(!v.prop&&!v.inicio);btn.textContent=v.prop?"Guardar y preparar enlace":eq?"Guardar y avisar al equipo":"Guardar y avisar al trabajador"}
}
async function guardarNueva(){
  const v=nuevaVals();if(!v)return;
  const ids=v.trabajadorIds,varios=ids.length>1;
  const nombres=ids.map(w=>trab(w)?.nombre).filter(Boolean);
  document.getElementById("n-save").disabled=true;
  const c=casa(v.casaId);let primero=null,grupo=null;
  // varios días: una tarea por día, enlazadas por "serie" (cada día respeta la jornada y los choques)
  const fechas=v.prop?[null]:v.fechas,serie=fechas.length>1?uid("s"):null;
  const rangoTxt=serie?` (${fechas.length} días: del ${fCorta(parse(fechas[0]))} al ${fCorta(parse(fechas[fechas.length-1]))})`:"";
  dias:for(let i=0;i<fechas.length;i++){
    grupo=varios?uid("g"):null;   // el equipo de cada día queda enlazado por "grupo"
    // una tarea por trabajador; si son varios, quedan enlazadas en el mismo equipo (grupo)
    for(const w of ids){
      const id=uid("t");
      const t={casaId:v.casaId,trabajadorId:w,tipo:v.tipo,descripcion:v.descripcion,duracion:v.duracion,inicio:fechas[i],estado:v.prop?"por_confirmar":"programada",opciones:v.opciones,fotos:[],nota:"",creada:new Date().toISOString(),...(grupo?{grupo}:{}),...(serie?{serie}:{}),
        historial:[{t:toStr(new Date()),txt:(v.prop?"Creada; esperando que el propietario elija fecha":"Creada y asignada")+(serie?` · día ${i+1} de ${fechas.length}`:"")+(grupo?" · equipo: "+listaY(nombres):"")}]};
      try{await put("tareas",id,t)}catch(e){if(!primero){document.getElementById("n-save").disabled=false;return}toast("No se guardaron todos los días. Revise la obra.");break dias}
      t.id=id;if(!primero)primero=id;
      // un solo aviso por trabajador (el del primer día), con todo el rango de la obra
      if(i===0){const otros=listaY(nombres.filter(n=>n!==trab(w)?.nombre));
        await aviso(t,`Nuevo trabajo: ${t.tipo} en ${casaTxt(c)}${v.prop?" (fecha por confirmar)":", "+fCorta(parse(t.inicio))+" "+hhmm(parse(t.inicio))}${rangoTxt}${grupo?" · en equipo con "+otros:""}`)}
    }
  }
  toast((serie?`Obra de ${fechas.length} días guardada. `:"Tarea guardada. ")+(varios?"Aviso enviado a todo el equipo.":"Aviso enviado al trabajador."));
  openSheet({kind:"mensaje",id:primero,fresh:true});
}

    ${ds.map((x,i)=>{const dx=parse(x.inicio),yo=x.inicio.slice(0,10)===t.inicio.slice(0,10);return `<button class="opt" style="text-align:left;width:100%;${yo?"border-color:var(--dark);border-width:2px":""}" data-act="det" data-id="${x.id}"><span><b>Día ${i+1}</b> · ${fCorta(dx)} · ${hhmm(dx)}–${hhmm(finT(dx,x.duracion))}</span><span class="pill st-${x.estado}" style="font-size:11px;padding:1px 8px">${ESTADO[x.estado]}</span></button>`}).join("")}</div>`}

  // reporte de cada integrante (cada uno reporta por separado)
  for(const m of eq){if(!(m.nota||(m.fotos||[]).length))continue;
    h+=`<div class="section stack"><h3>${varios?"Reporte de "+esc(nom(m)):"Reporte del trabajador"}</h3>${m.nota?`<div class="card">${esc(m.nota)}</div>`:""}${(m.fotos||[]).length?`<div class="photos">${m.fotos.map(f=>`<a href="${esc(blobUrl(f))}" target="_blank" rel="noopener"><img src="${esc(blobUrl(f))}" alt="Fotografía del trabajo"></a>`).join("")}</div>`:""}</div>`}
  h+=`<div class="section stack">`;
  if(!readOnly){
